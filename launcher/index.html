<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IDKLauncher</title>
<style>
  @font-face { font-family:'Thmanyah'; src:url('../assets/font.ttf'); font-weight:400; }
  @font-face { font-family:'Thmanyah'; src:url('../assets/font.ttf'); font-weight:700; }
  @font-face { font-family:'Thmanyah'; src:url('../assets/font.ttf'); font-weight:900; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:#000; color:#f5f5f5; font-family:'Thmanyah', serif;
    display:flex; flex-direction:column; overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  /* ===== header ===== */
  #hdr { text-align:center; padding-top:26px; transition:all .25s; }
  #clock { font-size:104px; font-weight:400; line-height:1.05; letter-spacing:1px; }
  #dateLine { font-size:19px; color:#9a9a9a; margin-top:4px; }
  #lockBtn { font-size:16px; margin-top:10px; cursor:pointer; display:inline-block; padding:2px 14px; }
  body.bookmode #hdr { padding-top:8px; text-align:start; padding-inline-start:18px; }
  body.bookmode #clock { font-size:20px; font-weight:700; display:inline; }
  body.bookmode #dateLine { display:none; }
  body.bookmode #lockBtn { float:left; margin-top:0; }
  /* ===== pager ===== */
  #pagerWrap { flex:1; overflow:hidden; position:relative; }
  #pager { display:flex; height:100%; transition:transform .32s ease; direction:ltr; }
  .page { direction:rtl; }
  .page { min-width:100%; height:100%; overflow-y:auto; padding:10px 14px 6px 14px; }
  .stageBox {
    border:1px solid #1c1c1c; border-radius:16px; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; text-align:center; gap:12px; overflow:hidden;
  }
  .stageBox img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; display:block; }
  .stageText { font-size:20px; line-height:1.9; white-space:pre-wrap; }
  .stageEmpty { font-size:34px; opacity:.85; }
  .row {
    border:1px solid #1c1c1c; border-radius:12px; padding:13px 16px; margin-bottom:10px;
    font-size:19px; display:flex; align-items:center; gap:10px; cursor:pointer; background:#000;
  }
  .row .sub { color:#9a9a9a; font-size:15px; margin-inline-start:auto; }
  .row.today { border-color:#3a3a3a; }
  .row.now { border-color:#f5f5f5; }
  .nextBox { border:1px solid #2c2c2c; border-radius:16px; padding:18px 16px; margin-bottom:14px; font-size:22px; line-height:1.7; text-align:center; }
  .nextBox .sub { color:#9a9a9a; font-size:17px; }
  .dayName { font-size:16px; color:#9a9a9a; margin:14px 2px 8px 2px; }
  .cardText { font-size:20px; line-height:2; white-space:pre-wrap; padding:6px 4px; }
  /* ===== dots ===== */
  #dots { display:flex; gap:8px; justify-content:center; padding:8px 0 2px 0; direction:ltr; }
  #dots span { width:7px; height:7px; border-radius:50%; background:#2a2a2a; }
  #dots span.on { background:#f5f5f5; }
  /* ===== book ===== */
  #bookImg { width:100%; border-radius:6px; background:#fff; }
  #bookImg.invert { filter:invert(1); }
  .bookNav { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:12px; }
  .pill {
    border:1px solid #2a2a2a; border-radius:999px; padding:9px 28px;
    font-size:17px; font-family:'Thmanyah', serif; color:#f5f5f5; background:#000; cursor:pointer;
  }
  .pill.dim { color:#9a9a9a; border-color:#1c1c1c; }
  #bookCount { font-size:15px; color:#9a9a9a; }
  /* ===== player ===== */
  #playerBar {
    margin:6px 14px 0 14px; border:1px solid #1c1c1c; border-radius:999px;
    padding:9px 18px; display:flex; align-items:center; gap:16px; font-size:16px;
  }
  #playerBar .ctl { cursor:pointer; font-size:18px; padding:2px 4px; }
  #nowPlaying { color:#c9c9c9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  /* ===== message box ===== */
  #msgRow { display:flex; align-items:center; margin:10px 14px 0 14px; border:1px solid #2a2a2a; border-radius:999px; padding:6px 8px 6px 18px; }
  #msgInput {
    flex:1; background:transparent; border:none; outline:none; color:#f5f5f5;
    font-family:'Thmanyah', serif; font-size:17px; padding:8px 0;
  }
  #msgInput::placeholder { color:#8a8a8a; }
  #sendBtn { font-size:19px; color:#f5f5f5; padding:6px 12px; cursor:pointer; }
  /* ===== dock ===== */
  #dock { display:flex; justify-content:space-between; padding:16px 30px 26px 30px; }
  .slot { width:60px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
  .slot .mono {
    width:52px; height:52px; border:1px solid #2a2a2a; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700;
    filter:grayscale(1);
  }
  .slot .emo { font-size:26px; filter:grayscale(1); }
  body.blackout #pagerWrap, body.blackout #dots, body.blackout #playerBar, body.blackout #msgRow, body.blackout #dock { display:none; }
  #blackoutBox { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  body.blackout #blackoutBox { display:flex; }
  #prayerLine { font-size:16px; color:#9a9a9a; margin-top:6px; min-height:20px; }
  /* ===== overlays ===== */
  .overlay {
    position:fixed; inset:0; background:#000; z-index:50; display:none;
    flex-direction:column; padding:22px 16px; overflow-y:auto;
  }
  .overlay.open { display:flex; }
  .overlay h2 { font-size:22px; font-weight:700; margin-bottom:14px; text-align:center; }
  .overlay .closeX { text-align:center; margin-top:10px; }
  #appsList { flex:1; overflow-y:auto; min-height:0; width:100%; }
  #appsSearch { width:100%; background:#000; border:1px solid #2a2a2a; border-radius:12px; color:#f5f5f5; font-family:'Thmanyah', serif; font-size:18px; padding:12px 14px; outline:none; margin-bottom:10px; }
  #gateReason, #gateAnswer {
    width:100%; background:#000; border:1px solid #2a2a2a; border-radius:12px; color:#f5f5f5;
    font-family:'Thmanyah', serif; font-size:18px; padding:12px 14px; outline:none; margin:10px 0;
  }
  #gateStatus { font-size:18px; line-height:1.9; text-align:center; min-height:56px; white-space:pre-wrap; }
  .bigBtn {
    width:100%; border:1px solid #f5f5f5; border-radius:999px; padding:13px; text-align:center;
    font-size:19px; cursor:pointer; margin-top:8px; background:#000; color:#f5f5f5; font-family:'Thmanyah', serif;
  }
  #toast {
    position:fixed; bottom:120px; left:50%; transform:translateX(-50%);
    background:#111; border:1px solid #2a2a2a; color:#f5f5f5; border-radius:999px;
    padding:10px 22px; font-size:16px; display:none; z-index:99; max-width:88%; text-align:center;
  }
</style>
</head>
<body>

<div id="hdr">
  <div id="clock">--:--</div>
  <div id="dateLine"></div>
  <div id="prayerLine"></div>
  <div><span id="lockBtn">🔒</span></div>
</div>

<div id="blackoutBox">
  <div style="font-size:44px">🔒</div>
  <button class="pill dim" id="emgBtn">طوارئ</button>
</div>

<div id="pagerWrap">
  <div id="pager">
    <!-- 0: المسرح -->
    <div class="page" id="pageStage">
      <div class="stageBox" id="stageBox">
        <div class="stageEmpty">🖼️</div>
        <div class="stageText" id="stageText"></div>
      </div>
    </div>
    <!-- 1: حصصي -->
    <div class="page" id="pageClasses"></div>
    <!-- 2: اليوم -->
    <div class="page" id="pageDay">
      <div class="cardText" id="dayCard">لا شيء بعد.</div>
    </div>
    <!-- 3: الأغاني -->
    <div class="page" id="pageMusic"></div>
    <!-- 4: الكتاب -->
    <div class="page" id="pageBook">
      <img id="bookImg" alt="">
      <div class="bookNav">
        <button class="pill dim" id="bookPrev">السابق</button>
        <span id="bookCount"></span>
        <button class="pill" id="bookNext">التالي</button>
      </div>
      <div class="bookNav">
        <button class="pill dim" id="bookInvert">وضع ليلي</button>
        <button class="pill dim" id="bookPick">الكتب</button>
      </div>
    </div>
  </div>
</div>

<div id="dots"><span class="on"></span><span></span><span></span><span></span><span></span></div>

<div id="playerBar">
  <span class="ctl" id="btnPrev">⏮</span>
  <span class="ctl" id="btnPlay">▶</span>
  <span class="ctl" id="btnNext">⏭</span>
  <span id="nowPlaying">—</span>
</div>

<div id="msgRow">
  <input id="msgInput" placeholder="اكتب لبوت…">
  <span id="sendBtn">➤</span>
</div>

<div id="dock"></div>

<!-- كل التطبيقات / اختيار أيقونة -->
<div class="overlay" id="appsOverlay">
  <h2 id="appsTitle">كل التطبيقات</h2>
  <input id="appsSearch" placeholder="ابحث عن تطبيق…">
  <div id="appsList"></div>
  <div class="closeX"><button class="pill dim" onclick="closeApps()">إغلاق</button></div>
</div>

<!-- بوابة الإذن -->
<div class="overlay" id="gateOverlay">
  <h2 id="gateAppName"></h2>
  <div id="gateAsk">
    <input id="gateReason" placeholder="اشرح لبوت: ليش بدك تفتحه؟">
    <button class="bigBtn" id="gateSend">اطلب الإذن</button>
  </div>
  <div id="gateWait" style="display:none">
    <div id="gateStatus">انبعت الطلب… ناطر قرار بوت</div>
    <input id="gateAnswer" placeholder="جوابك على سؤال بوت…" style="display:none">
    <button class="bigBtn" id="gateAnswerSend" style="display:none">ابعت الجواب</button>
  </div>
  <div class="closeX"><button class="pill dim" onclick="closeGate()">إلغاء</button></div>
</div>

<div id="toast"></div>

<script>
/* ================= CONFIG ================= */
var NTFY_IN  = 'https://ntfy.envs.net/omar2bot-752i77m7cmxaztpd6n';
var NTFY_OUT = 'https://ntfy.envs.net/bot2omar-1xgs36l2jzx2cohxe52';
var MUSIC_DIR = '/sdcard/Music/BotList';
var BOOKS_DIR = '/sdcard/Books';
/* جدول الحصص الأسبوعي — الترتيب من بوت؛ عدّل الأوقات هنا متى عرفتها */
var PERIODS = [[510,600],[610,700],[710,800]];
var SCHEDULE = {
  0: { day:'الأحد',    items:['Writing','Reading','Literature'] },
  1: { day:'الاثنين',  items:['Practical Education'] },
  2: { day:'الثلاثاء', items:['Writing','Phonetics','Reading'] },
  3: { day:'الأربعاء', items:['Speaking','Grammar','Literature'] },
  4: { day:'الخميس',   items:['Grammar','Educational Psychology','Listening'] },
  5: { day:'الجمعة',   items:[] },
  6: { day:'السبت',    items:[] }
};
var MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var EMO = { phone:'📞', whatsapp:'💬', camera:'📷', settings:'⚙️' };

/* ================= helpers ================= */
function $(id){ return document.getElementById(id); }
function ar(n){ return String(n).replace(/[0-9]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function ls(k, v){ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
function hasBot(){ return (typeof Bot !== 'undefined'); }
function toast(t){ var el=$('toast'); el.textContent=t; el.style.display='block'; setTimeout(function(){ el.style.display='none'; }, 3200); }
function postIn(body){
  return fetch(NTFY_IN, { method:'POST', body: body }).catch(function(){ toast('ما في نت — ما انبعت'); });
}

/* ================= clock ================= */
function tick(){
  var d = new Date();
  var h = d.getHours() % 12; if(h === 0) h = 12;
  var m = d.getMinutes(); if(m < 10) m = '0' + m;
  $('clock').textContent = h + ':' + m;
  $('dateLine').textContent = DAYS[d.getDay()] + ' ' + ar(d.getDate()) + ' ' + MONTHS[d.getMonth()];
}
tick(); setInterval(tick, 10000);

/* ================= pager ================= */
var curPage = 0, NPAGES = 5;
function goPage(i){
  curPage = Math.max(0, Math.min(NPAGES - 1, i));
  $('pager').style.transform = 'translateX(' + (-curPage * 100) + '%)';
  var dots = $('dots').children;
  for(var k = 0; k < dots.length; k++) dots[k].className = (k === curPage ? 'on' : '');
  document.body.className = (curPage === 4 ? 'bookmode' : '');
  if(curPage === 1) renderClasses();
  if(curPage === 3) renderMusic();
  if(curPage === 4) renderBook();
}
var tx0 = 0;
$('pagerWrap').addEventListener('touchstart', function(e){ tx0 = e.touches[0].clientX; }, {passive:true});
$('pagerWrap').addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tx0;
  if(dx < -50) goPage(curPage + 1);       /* سحب لليسار = التالية — المحتوى بيلحق الإصبع */
  else if(dx > 50) goPage(curPage - 1);
}, {passive:true});

/* ================= stage / day ================= */
var stageImgAt = 0;
function setStage(kind, val, cap){
  ls('stage', JSON.stringify({kind:kind, val:val, cap:cap || ''}));
  var box = $('stageBox');
  if(kind === 'img'){
    stageImgAt = Date.now();
    box.innerHTML = '<img src="' + val + '"><div class="stageText" id="stageCap" style="font-size:16px"></div>';
    if(cap) $('stageCap').textContent = cap;
  } else {
    box.innerHTML = '<div class="stageText"></div>';
    box.firstChild.textContent = val;
  }
}
function setStageCaption(cap){
  var c = $('stageCap');
  if(c){ c.textContent = cap; try { var s = JSON.parse(ls('stage') || '{}'); s.cap = cap; ls('stage', JSON.stringify(s)); } catch(e){} }
}
(function(){
  try {
    var s = JSON.parse(ls('stage') || 'null');
    if(s) setStage(s.kind, s.val, s.cap);
  } catch(e){}
  var day = ls('dayCard'); if(day) $('dayCard').textContent = day;
})();


/* ===== بيانات سحابية (launcher.json) — تحديث فوري بلا إعادة بناء ===== */
var PAGE_V = 8;
function checkUpdate(){
  fetch('launcher.json?ts=' + Date.now()).then(function(r){ return r.json(); }).then(function(j){
    if(j.config && j.config.blackout === false){ window.__blackoutOff = true; checkBlackout(); }
    if(j.config && j.config.blackout === true && window.__blackoutOff){ window.__blackoutOff = false; checkBlackout(); }
    if(j.day && j.day.text){
      var seen = parseInt(ls('dayUpdated') || '0', 10);
      if((j.day.updated || 0) >= seen){
        $('dayCard').textContent = j.day.text;
        ls('dayCard', j.day.text); ls('dayUpdated', String(j.day.updated || 0));
      }
    }
    if(j.pageVersion && j.pageVersion > PAGE_V){
      try {
        if(sessionStorage.getItem('rl') !== String(j.pageVersion)){
          sessionStorage.setItem('rl', String(j.pageVersion));
          location.reload();
        }
      } catch(e){ location.reload(); }
    }
  }).catch(function(){});
}
checkUpdate(); setInterval(checkUpdate, 15000);

/* ================= classes ================= */
function fmtTime(mins){
  var h = Math.floor(mins/60), m = mins % 60;
  var suf = h < 12 ? 'صباحًا' : 'ظهرًا';
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return ar(h12) + ':' + ar(m < 10 ? '0' + m : m) + ' ' + suf;
}
function fmtDur(mins){
  if(mins <= 0) return 'هلق';
  var h = Math.floor(mins/60), m = mins % 60, parts = [];
  if(h > 0) parts.push(h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : ar(h) + ' ساعات');
  if(m > 0) parts.push(ar(m) + (m === 1 ? ' دقيقة' : m === 2 ? ' دقيقتين' : m <= 10 ? ' دقائق' : ' دقيقة'));
  return parts.length ? parts.join(' و') : 'دقيقة';
}
function renderClasses(){
  var now = new Date();
  var s = SCHEDULE[now.getDay()];
  var cur = now.getHours()*60 + now.getMinutes();
  var html = '<div class="dayName" style="color:#f5f5f5;font-size:19px;margin-top:2px">حصص اليوم — ' + s.day + '</div>';
  if(!s.items.length){
    html += '<div class="nextBox">اليوم ما في دوام</div>';
  } else {
    var nowIdx = -1, nextIdx = -1, i, p;
    for(i = 0; i < s.items.length; i++){
      p = PERIODS[i];
      if(cur >= p[0] && cur < p[1]) nowIdx = i;
      if(cur < p[0] && nextIdx < 0) nextIdx = i;
    }
    var box;
    if(nowIdx >= 0) box = 'أنت بحصة ' + s.items[nowIdx] + '<br><span class="sub">باقي لها ' + fmtDur(PERIODS[nowIdx][1] - cur) + '</span>';
    else if(nextIdx >= 0) box = (nextIdx === 0 ? 'أول حصة اليوم: ' : 'الحصة الجاية: ') + s.items[nextIdx] + '<br><span class="sub">بعد ' + fmtDur(PERIODS[nextIdx][0] - cur) + '</span>';
    else box = 'خلص دوام اليوم';
    html += '<div class="nextBox">' + box + '</div>';
    for(var j = 0; j < s.items.length; j++){
      var q = PERIODS[j];
      html += '<div class="row' + (j === nowIdx ? ' now' : '') + '"><span>' + s.items[j] + '</span><span class="sub">' + fmtTime(q[0]) + ' – ' + fmtTime(q[1]) + '</span></div>';
    }
  }
  $('pageClasses').innerHTML = html;
}
setInterval(renderClasses, 30000);

function glyphFor(a){
  var p = (a.pkg || '').toLowerCase(), l = a.label || '', ll = l.toLowerCase();
  if(p.indexOf('muse') >= 0 || ll === 'muse' || ll.indexOf('muse ') >= 0) return '✨';
  if(p.indexOf('whatsapp') >= 0) return '💬';
  if(p.indexOf('camera') >= 0 || ll.indexOf('camera') >= 0) return '📷';
  if(p.indexOf('readera') >= 0 || ll.indexOf('readera') >= 0 || ll.indexOf('reader') >= 0) return '📖';
  if(p.indexOf('dialer') >= 0 || p.indexOf('phone') >= 0 || p.indexOf('contacts') >= 0 || ll.indexOf('phone') >= 0 || l.indexOf('هاتف') >= 0) return '📞';
  if(p.indexOf('settings') >= 0) return '⚙️';
  if(p.indexOf('music') >= 0 || ll.indexOf('music') >= 0 || l.indexOf('موسيقى') >= 0) return '🎵';
  return null;
}

/* ================= dock ================= */
var dockApps = [];
try { dockApps = JSON.parse(ls('dock') || '[]'); } catch(e){}
while(dockApps.length < 5) dockApps.push(null);
function renderDock(){
  var el = $('dock'); el.innerHTML = '';
  dockApps.forEach(function(a, i){
    var d = document.createElement('div'); d.className = 'slot';
    if(a){
      var emo = glyphFor(a);
      d.innerHTML = emo ? '<div class="emo">' + emo + '</div>'
                        : '<div class="mono">' + (a.label || '?').charAt(0) + '</div>';
    } else {
      d.innerHTML = '<div class="mono" style="color:#555">+</div>';
    }
    var pressT = null;
    d.addEventListener('touchstart', function(){ pressT = setTimeout(function(){ openApps(i); }, 550); }, {passive:true});
    d.addEventListener('touchend', function(e){
      if(pressT){ clearTimeout(pressT); pressT = null; }
      if(a && hasBot()) Bot.openApp(a.pkg);
      else if(!a) openApps(i);
    }, {passive:true});
    el.appendChild(d);
  });
}
renderDock();

/* ================= apps overlay ================= */
var pickSlot = -1; /* -1 = بوابة، رقم = تعيين أيقونة */
function renderApps(filter){
  var el = $('appsList'); el.innerHTML = '';
  var f = (filter || '').trim().toLowerCase();
  var list = (window.__allApps || []).filter(function(a){ return !f || a.label.toLowerCase().indexOf(f) >= 0; });
  if(!list.length){ el.innerHTML = '<div class="row"><span>لا نتائج</span></div>'; return; }
  list.forEach(function(a){
    var r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<span></span>'; r.firstChild.textContent = a.label;
    r.addEventListener('click', function(){
      closeApps();
      if(pickSlot >= 0){
        dockApps[pickSlot] = a; ls('dock', JSON.stringify(dockApps)); renderDock(); toast('انحطت الأيقونة');
      } else {
        openGate(a);
      }
    });
    el.appendChild(r);
  });
}
function openApps(slot){
  pickSlot = slot;
  $('appsTitle').textContent = (slot >= 0 ? 'اختر تطبيقًا للأيقونة' : 'كل التطبيقات — الفتح بإذن بوت');
  var list = [];
  if(hasBot()){ try { list = JSON.parse(Bot.listApps()); } catch(e){} }
  window.__allApps = list;
  $('appsSearch').value = '';
  if(!list.length) $('appsList').innerHTML = '<div class="row"><span>ما في تطبيقات مقروءة بعد — عطِ التطبيق صلاحية التخزين</span></div>';
  else renderApps('');
  $('appsOverlay').className = 'overlay open';
}
$('appsSearch').addEventListener('input', function(){ renderApps($('appsSearch').value); });
function closeApps(){ $('appsOverlay').className = 'overlay'; }
$('lockBtn').addEventListener('click', function(){ openApps(-1); });

/* ================= gate ================= */
var gateApp = null, gateId = null, gateTimer = null;
function openGate(a){
  gateApp = a; gateId = null;
  $('gateAppName').textContent = a.label;
  $('gateAsk').style.display = 'block';
  $('gateWait').style.display = 'none';
  $('gateReason').value = '';
  $('gateOverlay').className = 'overlay open';
}
function closeGate(){ $('gateOverlay').className = 'overlay'; if(gateTimer){ clearInterval(gateTimer); gateTimer = null; } }
$('gateSend').addEventListener('click', function(){
  var reason = $('gateReason').value.trim();
  if(!reason){ toast('اشرح السبب أولًا'); return; }
  gateId = 'g' + Date.now();
  postIn(JSON.stringify({ type:'gate', id:gateId, app:gateApp.label + '|' + gateApp.pkg, reason:reason }));
  $('gateAsk').style.display = 'none';
  $('gateWait').style.display = 'block';
  $('gateAnswer').style.display = 'none';
  $('gateAnswerSend').style.display = 'none';
  var left = 180;
  $('gateStatus').textContent = 'انبعت الطلب… ناطر قرار بوت (' + ar(left) + ')';
  gateTimer = setInterval(function(){
    left--;
    if(left <= 0){ clearInterval(gateTimer); gateTimer = null; $('gateStatus').textContent = 'ما وصل قرار — التطبيق بيضل مقفل. جرّب تعيد الطلب.'; return; }
    if($('gateAnswer').style.display === 'none') $('gateStatus').textContent = 'انبعت الطلب… ناطر قرار بوت (' + ar(left) + ')';
  }, 1000);
});
$('gateAnswerSend').addEventListener('click', function(){
  var ans = $('gateAnswer').value.trim(); if(!ans) return;
  postIn(JSON.stringify({ type:'gate', id:gateId, app:gateApp.label + '|' + gateApp.pkg, reason:'جواب: ' + ans }));
  $('gateAnswer').style.display = 'none'; $('gateAnswerSend').style.display = 'none';
  $('gateStatus').textContent = 'انبعت جوابك… ناطر القرار النهائي';
});
function gateDecision(m){
  if(!gateApp || m.id !== gateId) return;
  if(gateTimer){ clearInterval(gateTimer); gateTimer = null; }
  if(m.decision === 'allow'){
    $('gateStatus').textContent = '✅ سماح ' + ar(m.minutes || 10) + ' دقائق — ' + (m.note || '');
    setTimeout(function(){ closeGate(); if(hasBot()) Bot.openAppTimed(gateApp.pkg, m.minutes || 10); }, 900);
  } else if(m.decision === 'deny'){
    $('gateStatus').textContent = '🔒 مرفوض — ' + (m.note || '');
  } else if(m.decision === 'ask'){
    $('gateStatus').textContent = 'بوت بيسألك: ' + (m.note || '');
    $('gateAnswer').style.display = 'block'; $('gateAnswerSend').style.display = 'block';
  }
}

/* ================= music ================= */
var tracks = [], curTrack = -1;
function loadTracks(){
  tracks = [];
  if(hasBot()){ try { tracks = JSON.parse(Bot.listMusic(MUSIC_DIR)); } catch(e){} }
  return tracks;
}
function renderMusic(){
  loadTracks();
  var el = $('pageMusic');
  if(!tracks.length){ el.innerHTML = '<div class="row"><span>الفولدر فاضي — حط MP3ات بـ Music/BotList</span></div>'; return; }
  el.innerHTML = '';
  tracks.forEach(function(t, i){
    var r = document.createElement('div'); r.className = 'row' + (i === curTrack ? ' today' : '');
    var name = (t.title ? t.title : t.name.replace(/\.mp3$/i, '')) + (t.artist ? ' — ' + t.artist : '');
    r.innerHTML = '<span></span>'; r.firstChild.textContent = name;
    r.addEventListener('click', function(){ playTrack(i); });
    el.appendChild(r);
  });
}
function playTrack(i){
  if(!tracks.length) loadTracks();
  if(i < 0 || i >= tracks.length) return;
  curTrack = i;
  if(hasBot()) Bot.play(tracks[i].path);
  $('nowPlaying').textContent = (tracks[i].title || tracks[i].name.replace(/\.mp3$/i, '')) + (tracks[i].artist ? ' — ' + tracks[i].artist : '');
  $('btnPlay').textContent = '⏸';
}
$('btnPlay').addEventListener('click', function(){
  if(!hasBot()) return;
  if(Bot.isPlaying()){ Bot.pause(); $('btnPlay').textContent = '▶'; }
  else if(curTrack >= 0){ Bot.resume(); $('btnPlay').textContent = '⏸'; }
  else if(tracks.length || loadTracks().length){ playTrack(0); }
});
$('btnNext').addEventListener('click', function(){ if(tracks.length) playTrack((curTrack + 1) % tracks.length); });
$('btnPrev').addEventListener('click', function(){ if(tracks.length) playTrack((curTrack - 1 + tracks.length) % tracks.length); });
setInterval(function(){
  if(hasBot() && curTrack >= 0 && !Bot.isPlaying() && Bot.position() > 0 && Bot.duration() > 0 && Bot.position() >= Bot.duration() - 600){
    if(tracks.length) playTrack((curTrack + 1) % tracks.length);
  }
}, 1500);

/* ================= book ================= */
var bookId = ls('bookId') || 'naqd_awham_albouti';
var bookPage = parseInt(ls('bookPage') || '1', 10);
var bookPages = parseInt(ls('bookPages') || '294', 10);
var bookNight = ls('bookNight') === '1';
function renderBook(){
  var img = $('bookImg');
  if(hasBot()){
    var d = '';
    try { d = Bot.bookPageData(BOOKS_DIR, bookId, bookPage); } catch(e){}
    if(d){ img.src = d; img.style.display = 'block'; }
    else { img.removeAttribute('src'); img.style.display = 'none'; toast('الصفحة مو موجودة على الجوال'); }
  }
  img.className = bookNight ? 'invert' : '';
  $('bookCount').textContent = ar(bookPage) + ' / ' + ar(bookPages);
}
$('bookNext').addEventListener('click', function(){ if(bookPage < bookPages){ bookPage++; ls('bookPage', String(bookPage)); renderBook(); } });
$('bookPrev').addEventListener('click', function(){ if(bookPage > 1){ bookPage--; ls('bookPage', String(bookPage)); renderBook(); } });
$('bookInvert').addEventListener('click', function(){ bookNight = !bookNight; ls('bookNight', bookNight ? '1' : '0'); renderBook(); });
$('bookPick').addEventListener('click', function(){
  var books = [];
  if(hasBot()){ try { books = JSON.parse(Bot.listBooks(BOOKS_DIR)); } catch(e){} }
  if(!books.length){ toast('ما في كتب بـ Books على الجوال'); return; }
  /* تنقّل دائري بسيط بين الكتب المتوفرة */
  var idx = 0;
  for(var i = 0; i < books.length; i++) if(books[i].id === bookId) idx = i;
  var nx = books[(idx + 1) % books.length];
  bookId = nx.id; bookPages = nx.pages; bookPage = 1;
  ls('bookId', bookId); ls('bookPages', String(bookPages)); ls('bookPage', '1');
  renderBook(); toast('انفتح: ' + bookId);
});

/* ================= channel: send + poll ================= */
$('sendBtn').addEventListener('click', sendMsg);
$('msgInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') sendMsg(); });
function sendMsg(){
  var v = $('msgInput').value.trim(); if(!v) return;
  $('msgInput').value = '';
  postIn(v).then(function(){ toast('انبعتت لبوت'); });
}

/* ================= أوامر بوت (من القناة) ================= */
var APP_ALIASES = {'انستغرام':'Instagram','إنستغرام':'Instagram','انستا':'Instagram','واتساب':'WhatsApp','الكاميرا':'Camera','المعرض':'Gallery','يوتيوب':'YouTube','الهاتف':'Phone','الاتصال':'Phone','المكالمات':'Phone','المنبه':'Clock','الساعة':'Clock','الإعدادات':'Settings','الملفات':'Files','كروم':'Chrome','المتصفح':'Chrome','تيليغرام':'Telegram','فيسبوك':'Facebook','الماسنجر':'Messenger','الخرائط':'Maps','المتجر':'Play Store','جوجل بلاي':'Play Store','الآلة الحاسبة':'Calculator','الحاسبة':'Calculator','التقويم':'Calendar','الرسائل':'Messages'};
function normName(x){ return (x || '').toLowerCase().replace(/[ً-ٰٟ]/g, '').replace(/\s+/g, ''); }
function resolveApp(label, labelEn){
  if(!hasBot()) return null;
  var list = [];
  try { list = JSON.parse(Bot.listApps()); } catch(e){}
  var cands = [labelEn, APP_ALIASES[label], label];
  for(var c = 0; c < cands.length; c++){
    if(!cands[c]) continue;
    var want = normName(cands[c]);
    for(var i = 0; i < list.length; i++) if(normName(list[i].label) === want) return list[i];
    for(var j = 0; j < list.length; j++) if(normName(list[j].label).indexOf(want) >= 0 || want.indexOf(normName(list[j].label)) >= 0) return list[j];
  }
  return null;
}
function runCmd(m){
  if(m.action === 'open_app'){
    var a = resolveApp(m.label, m.label_en);
    if(a){ toast('بوت عم يفتح: ' + a.label); Bot.openApp(a.pkg); }
    else toast('ما لقيت تطبيق: ' + (m.label || ''));
  } else if(m.action === 'set_alarm'){
    if(hasBot()){ Bot.setAlarm(m.hour || 0, m.minute || 0, m.label || ''); toast('انضبط منبه ' + ar(m.hour) + ':' + ar(String(m.minute).length < 2 ? '٠' + m.minute : m.minute)); }
  } else if(m.action === 'guard_off'){
    if(hasBot()){ Bot.setGuardOff(m.minutes || 30); toast('بوت رفع الحارس ' + ar(m.minutes || 30) + ' دقيقة'); }
  } else if(m.action === 'call'){
    if(hasBot() && m.number){ Bot.callNumber(m.number); toast('عم اتصل: ' + m.number); }
  }
}

function handleChannelMessage(ev){
  var m = ev.message || '';
  var parsed = null;
  try { parsed = JSON.parse(m); } catch(e){}
  if(parsed && parsed.type === 'gate'){ gateDecision(parsed); return; }
  if(parsed && parsed.type === 'cmd'){ runCmd(parsed); return; }
  if(parsed && parsed.type === 'open_book'){
    bookId = parsed.book; bookPage = parsed.page;
    if(parsed.pages) bookPages = parsed.pages;
    ls('bookId', bookId); ls('bookPage', String(bookPage));
    goPage(4); if(parsed.note) toast(parsed.note);
    return;
  }
  if(parsed && parsed.type === 'day'){
    $('dayCard').textContent = parsed.text || '';
    ls('dayCard', parsed.text || '');
    return;
  }
  if(ev.attachment && ev.attachment.url){
    var url = ev.attachment.url;
    if(hasBot()){ try { var local = Bot.fetchToFile(url, 'stage'); if(local){ var d2 = Bot.readFileData(local); if(d2) url = d2; } } catch(e){} }
    setStage('img', url, ev.title || '');
    return;
  }
  if(m){
    var cur = null; try { cur = JSON.parse(ls('stage') || 'null'); } catch(e){}
    if(cur && cur.kind === 'img' && (Date.now() - stageImgAt) < 30000) setStageCaption(m);
    else setStage('text', m);
  }
}
function pollChannel(){
  var last = ls('ntfyLast') || '12h';
  fetch(NTFY_OUT + '/json?poll=1&since=' + encodeURIComponent(last))
    .then(function(r){ return r.text(); })
    .then(function(txt){
      txt.split('\n').forEach(function(line){
        if(!line.trim()) return;
        try {
          var ev = JSON.parse(line);
          if(ev.event === 'message' && ev.id){ ls('ntfyLast', ev.id); handleChannelMessage(ev); }
        } catch(e){}
      });
    })
    .catch(function(){});
}
pollChannel(); setInterval(pollChannel, 5000);


/* ================= الصلاة (حمص) ================= */
var PRAYERS = [['الفجر','Fajr'],['الشروق','Sunrise'],['الظهر','Dhuhr'],['العصر','Asr'],['المغرب','Maghrib'],['العشاء','Isha']];
function loadPrayer(){
  var today = new Date().toDateString();
  try {
    var c = JSON.parse(ls('prayerCache') || 'null');
    if(c && c.day === today){ renderPrayer(c.timings); return; }
  } catch(e){}
  fetch('https://api.aladhan.com/v1/timingsByCity?city=Homs&country=Syria&method=5')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var t = j.data.timings;
      ls('prayerCache', JSON.stringify({ day: today, timings: t }));
      renderPrayer(t);
    })
    .catch(function(){
      try { var c2 = JSON.parse(ls('prayerCache') || 'null'); if(c2) renderPrayer(c2.timings); } catch(e){}
    });
}
function renderPrayer(t){
  if(!t) return;
  var now = new Date();
  for(var i = 0; i < PRAYERS.length; i++){
    var parts = (t[PRAYERS[i][1]] || '').split(' ')[0].split(':');
    if(parts.length < 2) continue;
    var d = new Date(); d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
    if(d > now){
      var mins = Math.round((d - now) / 60000);
      var hh = Math.floor(mins / 60), mm = mins % 60;
      var left = hh > 0 ? ('بعد ' + ar(hh) + ' س و' + ar(mm) + ' د') : ('بعد ' + ar(mm) + ' دقيقة');
      $('prayerLine').textContent = PRAYERS[i][0] + ' ' + ar(parseInt(parts[0],10) % 12 === 0 ? 12 : parseInt(parts[0],10) % 12) + ':' + ar(parts[1].length < 2 ? '٠' + parts[1] : parts[1]) + ' — ' + left;
      return;
    }
  }
  $('prayerLine').textContent = 'الفجر غدًا بإذن الله';
}
loadPrayer();

/* ================= الحظر الليلي ١٢–٦ ================= */
function checkBlackout(){
  var h = new Date().getHours();
  var on = !window.__blackoutOff && (h >= 0 && h < 6);
  var was = document.body.classList.contains('blackout');
  document.body.classList.toggle('blackout', on);
  if(on && !was) toast('وضع الليل: الهاتف مقفل لحد ٦ الصبح — طوارئ بس');
}
checkBlackout();
$('emgBtn').addEventListener('click', function(){ if(hasBot()) Bot.emergencyDial(); });

setInterval(function(){ tick(); checkBlackout(); }, 5000);
goPage(0);
</script>
