  <div id="todayFooter" class="today-footer">
    Designed by IDKStudy •
    <a href="https://idkstudy.github.io">الموقع</a>
    • <span id="htmlVer"></span>
  </div>

  <script>
    let SCHEDULES = {
      first: {
        1: {
          0: ["Reading", "Writing", "Grammar"],
          1: ["General Education", "Phonetics", "Arabic"],
          2: ["Grammar", "Literature", "Speaking", "Speaking"],
          3: ["Reading", "Grammar", "Writing"],
          4: ["Methods", "Writing", "Listening"]
        },
        2: {
          0: ["Methods", "Phonetics", "Literature"],
          1: ["Literature", "Arabic", "General Education"],
          2: ["Methods", "Grammar", "Speaking", "Reading"],
          3: ["Methods", "Reading", "Speaking"],
          4: ["Listening", "Speaking", "Writing"]
        }
      },
      second: {
        1: {
          0: ["Speaking", "Reading", "Literature"],
          1: ["Practical Education (Field Training)"],
          2: ["Grammar", "Writing", "Listening"],
          3: ["Physiology", "Phonetics", "Literature"],
          4: ["Writing", "Grammar", "Reading"]
        },
        2: {
          0: ["Listening", "Literature", "Reading"],
          1: ["Practical Education (Field Training)"],
          2: ["Writing", "Phonetics", "Literature"],
          3: ["Grammar", "Reading", "Speaking"],
          4: ["Physiology", "Writing", "Grammar"]
        },
        3: {
          0: ["Grammar", "Reading", "Phonetics"],
          1: ["Practical Education (Field Training)"],
          2: ["Writing", "Listening", "Literature"],
          3: ["Speaking", "Reading", "Literature"],
          4: ["Grammar", "Physiology", "Writing"]
        },
        4: {
          0: ["Literature", "Grammar", "Reading"],
          1: ["Practical Education (Field Training)"],
          2: ["Listening", "Writing", "Phonetics"],
          3: ["Literature", "Speaking", "Reading"],
          4: ["Writing", "Grammar", "Physiology"]
        }
      }
    };

    /* ===== السنوات والشعب ديناميكية: تُشتق من البيانات المحمّلة نفسها ===== */
    const YEAR_LABEL = { first: "First Year", second: "Second Year", third: "Third Year", fourth: "Fourth Year", fifth: "Fifth Year", sixth: "Sixth Year" };
    const YEAR_ORDER = ["first", "second", "third", "fourth", "fifth", "sixth"];

    function yearKeys() {
      const keys = Object.keys(SCHEDULES || {});
      return keys.sort((a, b) => {
        const ia = YEAR_ORDER.indexOf(a), ib = YEAR_ORDER.indexOf(b);
        if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        const na = Number(a), nb = Number(b);
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        return String(a).localeCompare(String(b));
      });
    }

    function yearLabel(year) {
      if (YEAR_LABEL[year]) return YEAR_LABEL[year];
      const s = String(year);
      return s.charAt(0).toUpperCase() + s.slice(1) + " Year";
    }

    function sectionsOf(year) {
      const y = (SCHEDULES && SCHEDULES[year]) || {};
      return Object.keys(y).sort((a, b) => {
        const na = Number(a), nb = Number(b);
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        return String(a).localeCompare(String(b));
      });
    }

    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const dayLetters = ["S", "M", "T", "W", "T", "F", "S"];
    const HTML_VERSION = "v1.207";
    const STORAGE_KEY = "scheduleSettings";

    let userSettings = null;

    /* ===== بيانات الجدول والأوقات (من الرابط + SharedPreferences) ===== */
    const DEFAULT_TIMES = [[510, 600], [610, 700], [710, 800], [800, 870]];
    let TIMES = DEFAULT_TIMES;
    let UPDATED = "";
    let lastDayStamp = "";
    let scrollRaf = 0;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function parseTimes(arr) {
      if (!Array.isArray(arr) || !arr.length) return null;
      const out = [];
      for (let i = 0; i < arr.length; i++) {
        const m = /^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec(String(arr[i]).trim());
        if (!m) return null;
        const s = +m[1] * 60 + +m[2];
        const e = +m[3] * 60 + +m[4];
        if (e <= s || (out.length && s < out[out.length - 1][1])) return null;
        out.push([s, e]);
      }
      return out;
    }

    const META_KEYS = { updated: 1, times: 1, ads: 1, SCHEDULES: 1 };

    function extractSchedule(obj) {
      if (obj && typeof obj === "object" && obj.SCHEDULES) obj = obj.SCHEDULES;
      if (!obj || typeof obj !== "object") return null;
      const years = Object.keys(obj).filter(k => !META_KEYS[k]);
      if (!years.length) return null;
      const out = {};
      for (let i = 0; i < years.length; i++) {
        const y = obj[years[i]];
        if (!y || typeof y !== "object") return null;
        const secs = Object.keys(y);
        if (!secs.length) return null;
        for (let j = 0; j < secs.length; j++) {
          const sec = y[secs[j]];
          if (!sec || typeof sec !== "object") return null;
          const ds = Object.keys(sec);
          if (!ds.length) return null;
          for (let k = 0; k < ds.length; k++) {
            if (!Array.isArray(sec[ds[k]])) return null;
          }
        }
        out[years[i]] = y;
      }
      return out;
    }

    function installData(parsed) {
      const valid = extractSchedule(parsed);
      if (!valid) return false;
      SCHEDULES = valid;
      TIMES = parseTimes(parsed && parsed.times) || DEFAULT_TIMES;
      UPDATED = (parsed && typeof parsed.updated === "string") ? parsed.updated : "";
      return true;
    }

    function formatUpdated(str) {
      if (!str) return "";
      const m = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(String(str).trim());
      if (!m) return String(str);
      let out = dateFormatter.format(new Date(+m[1], +m[2] - 1, +m[3]));
      if (m[4] !== undefined) out += " • " + formatTime12h(+m[4] * 60 + +m[5]);
      return out;
    }

    function updateSetupInfo() {
      const el = document.getElementById("setupInfo");
      if (!el) return;
      const when = formatUpdated(UPDATED);

      const head = when
        ? `<div class="setup-info-label">Schedule last updated</div>
           <div class="setup-info-date">${esc(when)}</div>`
        : `<div class="setup-info-label">Schedule version</div>
           <div class="setup-info-date">Built-in copy</div>`;

      const second = when
        ? "If the schedule changes after this date, don't rely on this version."
        : "Not synced yet, so this copy may be outdated.";

      el.innerHTML = `
        ${head}
        <div class="setup-info-divider"></div>
        <div class="setup-info-notes">
          <div class="setup-info-note">
            <span class="ni">🌐</span>
            <span>Connect to the internet when you first open the app, or after the schedule changes, so it can update.</span>
          </div>
          <div class="setup-info-note">
            <span class="ni">⚠️</span>
            <span>${second}</span>
          </div>
        </div>`;
    }

    (function loadCachedSchedule() {
      try {
        if (!window.AndroidSchedule) return;
        const raw = window.AndroidSchedule.getSchedule();
        if (raw) installData(JSON.parse(raw));
      } catch (e) {}
    })();

    function refreshWeekIfVisible() {
      weekRendered = false;
      if (!weekView.classList.contains("is-hidden")) {
        renderWeek();
        weekRendered = true;
      }
    }

    window.applyNewSchedule = function (raw) {
      try {
        if (!installData(typeof raw === "string" ? JSON.parse(raw) : raw)) return;
        updateSetupInfo();
        if (!userSettings) return;
        if (!SCHEDULES[userSettings.year] || !SCHEDULES[userSettings.year][userSettings.section]) {
          openSetup();
          return;
        }
        lastTodayKey = "";
        lastTomorrowKey = "";
        updatePage();
        refreshWeekIfVisible();
      } catch (e) {}
    };

    /* ===== الإعلانات ===== */
    let ADS = [];
    let lastAdKey = "";

    function installAds(parsed) {
      const list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.ads) ? parsed.ads : null);
      if (!list) return false;
      ADS = list.filter(a => a && typeof a === "object");
      lastAdKey = "";
      return true;
    }

    (function loadCachedAds() {
      try {
        if (!window.AndroidSchedule) return;
        const raw = window.AndroidSchedule.getAds();
        if (raw) installAds(JSON.parse(raw));
      } catch (e) {}
    })();

    window.applyNewAds = function (raw) {
      try {
        if (!installAds(typeof raw === "string" ? JSON.parse(raw) : raw)) return;
        if (userSettings) updatePage();
      } catch (e) {}
    };

    function adDate(str, isEnd) {
      const m = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?$/.exec(String(str || "").trim());
      if (!m) return null;
      const hasTime = m[4] !== undefined;
      return new Date(
        +m[1], +m[2] - 1, +m[3],
        hasTime ? +m[4] : (isEnd ? 23 : 0),
        hasTime ? +m[5] : (isEnd ? 59 : 0),
        (isEnd && !hasTime) ? 59 : 0
      );
    }

    function pickAd(now) {
      if (!userSettings) return null;
      const y = userSettings.year;
      const s = String(userSettings.section);
      let best = null;

      ADS.forEach(ad => {
        if (!ad.title && !ad.text) return;

        const years = ad.years;
        if (Array.isArray(years) && years.length && years.indexOf("all") === -1 && years.indexOf(y) === -1) return;
        if (typeof years === "string" && years !== "all" && years !== y) return;

        if (Array.isArray(ad.sections) && ad.sections.length &&
            ad.sections.map(String).indexOf(s) === -1) return;

        if (ad.start) { const d = adDate(ad.start, false); if (!d || now < d) return; }
        if (ad.end)   { const d = adDate(ad.end, true);    if (!d || now > d) return; }

        const p = Number(ad.priority) || 0;
        if (!best || p > best.p) best = { ad: ad, p: p };
      });
      return best ? best.ad : null;
    }

    function updateAd(now, nowMinutes) {
      const el = document.getElementById("adBanner");
      if (!el || !userSettings) return;

      const key = userSettings.year + "|" + userSettings.section + "|" + nowMinutes;
      if (key === lastAdKey) return;
      lastAdKey = key;

      const ad = pickAd(now);
      if (!ad) {
        el.hidden = true;
        el.removeAttribute("href");
        el.dataset.adId = "";
        return;
      }

      const id = String(ad.id || ad.title || ad.text);
      const link = (typeof ad.link === "string" && /^https?:\/\//i.test(ad.link.trim())) ? ad.link.trim() : "";

      document.getElementById("adIcon").textContent = ad.icon ? String(ad.icon) : "📢";
      document.getElementById("adTitle").textContent = ad.title ? String(ad.title) : "";
      document.getElementById("adText").textContent = ad.text ? String(ad.text) : "";

      if (link) { el.setAttribute("href", link); el.classList.add("clickable"); }
      else { el.removeAttribute("href"); el.classList.remove("clickable"); }

      if (el.hidden || el.dataset.adId !== id) {
        el.hidden = false;
        el.classList.remove("ad-in");
        void el.offsetWidth;
        el.classList.add("ad-in");
      }
      el.dataset.adId = id;
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !data.year || !data.section) return null;
        if (!SCHEDULES[data.year] || !SCHEDULES[data.year][data.section]) return null;
        return data;
      } catch (e) { return null; }
    }
    function saveSettings(year, section) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ year, section })); } catch (e) {}
    }
    function reportTarget() {
      try {
        if (window.AndroidSchedule && window.AndroidSchedule.setTarget && userSettings) {
          window.AndroidSchedule.setTarget(String(userSettings.year), String(userSettings.section));
        }
      } catch (e) {}
    }
    function getCurrentSchedule() {
      if (!userSettings) return {};
      return SCHEDULES[userSettings.year][userSettings.section] || {};
    }

    function getPeriodsForDay(dayIndex) {
      if (isFieldDay(dayIndex)) return [];
      const n = (getCurrentSchedule()[dayIndex] || []).length;
      const periods = [];
      let prevEnd = null;
      for (let i = 0; i < n; i++) {
        let s, e;
        if (i < TIMES.length) {
          s = TIMES[i][0];
          e = TIMES[i][1];
        } else {
          const last = TIMES[TIMES.length - 1];
          s = prevEnd;
          e = s + (last[1] - last[0]);
        }
        if (prevEnd !== null && s > prevEnd) {
          periods.push({ type: "break", start: prevEnd, end: s });
        }
        periods.push({ type: "lesson", index: i, start: s, end: e });
        prevEnd = e;
      }
      return periods;
    }

    function isFieldDay(dayIndex) {
      const subjects = getCurrentSchedule()[dayIndex] || [];
      return subjects.length === 1 && subjects[0].indexOf("Practical Education") !== -1;
    }
    function isOffDay(dayIndex) {
      const subjects = getCurrentSchedule()[dayIndex] || [];
      return subjects.length === 0 && !isFieldDay(dayIndex);
    }

    const dateFormatter = new Intl.DateTimeFormat("en-US", { day: "numeric", month: "long", year: "numeric" });
    function pad(n) { return String(n).padStart(2, "0"); }
    function formatTime12h(minutes) {
      let h = Math.floor(minutes / 60); const m = minutes % 60;
      const p = h >= 12 ? "PM" : "AM"; h = h % 12; h = h ? h : 12;
      return `${pad(h)}:${pad(m)} ${p}`;
    }
    function formatClock12h(date) {
      let h = date.getHours(); const m = date.getMinutes(); const s = date.getSeconds();
      const p = h >= 12 ? "PM" : "AM"; h = h % 12; h = h ? h : 12;
      return `${pad(h)}:${pad(m)}:${pad(s)} ${p}`;
    }
    function formatCountdown(totalSeconds) {
      totalSeconds = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
      return `${pad(m)}:${pad(s)}`;
    }

    function attachTapFeedback(root, selector) {
      const sel = selector || ".lesson, .tomorrow-lesson, .week-row";
      root.querySelectorAll(sel).forEach(el => {
        if (el.dataset.tapBound) return;
        el.dataset.tapBound = "1";
        el.classList.add("tap-zone");
        el.addEventListener("pointerdown", (e) => {
          const rect = el.getBoundingClientRect();
          el.style.setProperty("--tx", ((e.clientX - rect.left) / rect.width * 100) + "%");
          el.style.setProperty("--ty", ((e.clientY - rect.top) / rect.height * 100) + "%");
          el.classList.add("tapped");
        });
        ["pointerup","pointercancel","pointerleave"].forEach(ev =>
          el.addEventListener(ev, () => el.classList.remove("tapped"))
        );
      });
    }
    function attachBtnRipple(btn) {
      if (!btn || btn.dataset.rippleBound) return;
      btn.dataset.rippleBound = "1";
      btn.addEventListener("pointerdown", (e) => {
        const rect = btn.getBoundingClientRect();
        btn.style.setProperty("--tx", ((e.clientX - rect.left) / rect.width * 100) + "%");
        btn.style.setProperty("--ty", ((e.clientY - rect.top) / rect.height * 100) + "%");
        btn.classList.add("tapped");
      });
      ["pointerup","pointercancel","pointerleave"].forEach(ev =>
        btn.addEventListener(ev, () => btn.classList.remove("tapped"))
      );
    }

    let lastTodayKey = "";

    function createPeriodElement(period, day, nowMinutes) {
      const isCurrent = nowMinutes >= period.start && nowMinutes < period.end;
      const isPast = nowMinutes >= period.end;
      const el = document.createElement("div");

      if (period.type === "break") {
        el.className = "break";
        if (isCurrent) el.classList.add("current");
        if (isPast) el.classList.add("past");
        el.innerHTML = `
          <span>Break</span>
          <span class="break-time">${formatTime12h(period.start)} – ${formatTime12h(period.end)}</span>`;
        return el;
      }
      el.className = "lesson";
      if (isCurrent) el.classList.add("current");
      if (isPast) el.classList.add("past");

      const subject = getCurrentSchedule()[day][period.index];
      const status = isCurrent ? "Now" : (isPast ? "Ended" : "Upcoming");
      el.innerHTML = `
        <div>
          <div class="lesson-name">${esc(subject)}</div>
          <div class="lesson-time">${formatTime12h(period.start)} – ${formatTime12h(period.end)}</div>
        </div>
        <span class="lesson-status">${status}</span>`;
      return el;
    }

    function renderToday(day, nowMinutes) {
      const periods = getPeriodsForDay(day);
      const currentIdx = periods.findIndex(p => nowMinutes >= p.start && nowMinutes < p.end);
      const sched = getCurrentSchedule()[day] || [];
      const key = `${day}::${currentIdx}::${sched.length}::${userSettings.year}::${userSettings.section}`;

      if (key === lastTodayKey) return;
      lastTodayKey = key;

      const c = document.getElementById("todaySchedule");
      c.innerHTML = "";

      if (sched.length === 0 || isFieldDay(day)) {
        if (isFieldDay(day)) {
          c.innerHTML = `
            <div class="empty field-day">
              <span class="field-icon">🧑‍🏫</span>
              <span class="field-title">Field Training Day</span>
              <span class="field-sub">No fixed hours — you're out in the field.</span>
            </div>`;
        } else {
          c.innerHTML = `<div class="empty">No classes today 🎉<br>Enjoy your day off.</div>`;
        }
        return;
      }
      periods.forEach(p => c.appendChild(createPeriodElement(p, day, nowMinutes)));
      attachTapFeedback(c);
    }

    let lastTomorrowKey = "";

    function renderTomorrow(day, date) {
      const sched = getCurrentSchedule()[day] || [];
      const key = `${day}::${date.toDateString()}::${sched.length}::${userSettings.year}::${userSettings.section}`;

      if (key === lastTomorrowKey) return;
      lastTomorrowKey = key;

      const c = document.getElementById("tomorrowSchedule");
      c.innerHTML = "";
      document.getElementById("tomorrowTitle").textContent = `Tomorrow — ${days[day]}`;
      document.getElementById("tomorrowDate").textContent = dateFormatter.format(date);

      if (sched.length === 0 || isFieldDay(day)) {
        if (isFieldDay(day)) {
          c.innerHTML = `
            <div class="tomorrow-lesson" style="min-width:auto; align-items:center; flex-direction:row; justify-content:center; gap:6px;">
              <span style="font-size:16px;">🧑‍🏫</span>
              <span class="tomorrow-name" style="color:var(--field-deep);">Field Day</span>
            </div>`;
        } else {
          c.innerHTML = `<div class="tomorrow-lesson" style="min-width:auto; align-items:center; justify-content:center;">
            <span class="tomorrow-name" style="color:var(--text-muted);">No classes 🎉</span>
          </div>`;
        }
        return;
      }
      getPeriodsForDay(day).filter(p => p.type === "lesson").forEach(period => {
        const subject = sched[period.index];
        const row = document.createElement("div");
        row.className = "tomorrow-lesson";
        row.innerHTML = `
          <span class="tomorrow-name">${esc(subject)}</span>
          <span class="tomorrow-time">${formatTime12h(period.start)} – ${formatTime12h(period.end)}</span>`;
        c.appendChild(row);
      });
      attachTapFeedback(c);
    }

    function getCurrentStatus(day, nowMinutes, seconds) {
      const subjects = getCurrentSchedule()[day] || [];
      const result = { label: "", value: "", detail: "", state: "before" };

      if (subjects.length === 0 || isFieldDay(day)) {
        if (isFieldDay(day)) {
          result.label = "Status";
          result.value = "Field Day";
          result.detail = "Practical Education — outdoor training day.";
          result.state = "field";
        } else {
          result.label = "Status";
          result.value = "Day Off";
          result.detail = "No lectures scheduled today.";
          result.state = "off";
        }
        return result;
      }
      const periods = getPeriodsForDay(day);
      const firstLesson = periods.find(p => p.type === "lesson");
      const nowTotal = nowMinutes * 60 + seconds;
      const currentPeriod = periods.find(p => nowMinutes >= p.start && nowMinutes < p.end);

      if (!currentPeriod && firstLesson && nowMinutes < firstLesson.start) {
        const rem = firstLesson.start * 60 - nowTotal;
        result.label = "Time until first class";
        result.value = formatCountdown(rem);
        result.detail = `First: ${subjects[0]} — ${formatTime12h(firstLesson.start)}`;
        result.state = "before";
        return result;
      }
      if (currentPeriod) {
        const rem = currentPeriod.end * 60 - nowTotal;
        result.value = formatCountdown(rem);
        if (currentPeriod.type === "break") {
          result.label = "Break ends in";
          const next = periods.find(p => p.type === "lesson" && p.start >= currentPeriod.end);
          result.detail = next ? `Next: ${subjects[next.index]} at ${formatTime12h(next.start)}` : "On break";
          result.state = "break";
        } else {
          result.label = "Class ends in";
          const subj = subjects[currentPeriod.index];
          const nextPeriod = periods.find(p => p.type === "lesson" && p.start >= currentPeriod.end);
          result.detail = nextPeriod
            ? `Next: ${subjects[nextPeriod.index]} at ${formatTime12h(nextPeriod.start)}`
            : `${subj} — ends ${formatTime12h(currentPeriod.end)}`;
          result.state = "lesson";
        }
        return result;
      }
      result.label = "Status";
      result.value = "Day Finished";
      result.detail = "All classes for today are done.";
      result.state = "finished";
      return result;
    }

    function updateCountdown(day, nowMinutes, seconds) {
      const s = getCurrentStatus(day, nowMinutes, seconds);
      const card = document.getElementById("countdownCard");
      const valueEl = document.getElementById("countValue");

      card.className = "countdown-card cd-" + s.state;

      const wordValues = ["Field Day", "Day Off", "Day Finished"];
      if (wordValues.indexOf(s.value) !== -1) {
        valueEl.classList.add("text-mode");
      } else {
        valueEl.classList.remove("text-mode");
      }

      document.getElementById("countLabel").textContent = s.label;
      valueEl.textContent = s.value;
      document.getElementById("countDetail").textContent = s.detail;
    }

    function updateSectionBadges() {
      if (!userSettings) return;
      const text = `${yearLabel(userSettings.year)} • Sec ${userSettings.section}`;
      document.getElementById("sectionBadge").textContent = text;
      document.getElementById("sectionBadgeWeek").textContent = text;
    }

    function updatePage() {
      if (!userSettings) return;
      const now = new Date();
      const day = now.getDay();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const stamp = now.toDateString();
      if (stamp !== lastDayStamp) {
        const changed = lastDayStamp !== "";
        lastDayStamp = stamp;
        if (changed) refreshWeekIfVisible();
      }

      document.getElementById("dayName").textContent = days[day];
      document.getElementById("date").textContent = dateFormatter.format(now);
      document.getElementById("clock").textContent = formatClock12h(now);

      renderToday(day, nowMinutes);
      updateCountdown(day, nowMinutes, now.getSeconds());
      updateAd(now, nowMinutes);

      const t = new Date(now);
      t.setDate(now.getDate() + 1);
      renderTomorrow(t.getDay(), t);
    }

    const WEEK_SIZE = 7;
    const REAL_OFFSET = 7;
    const TOTAL_SLIDES = WEEK_SIZE * 3;
    const RING_RADIUS = 145;

    let weekRendered = false;
    let weekCurrentIndex = 0;
    let settleTimer = null;
    let isJumping = false;

    let ringTargetRot = 0;
    let ringCurrentRot = 0;
    let ringAnimating = false;

    function positionRingDots(rotationDeg) {
      const dots = document.querySelectorAll(".ring-dot");
      if (!dots.length) return;
      const rad = Math.PI / 180;
      dots.forEach((dot, i) => {
        const baseAngle = i * (360 / WEEK_SIZE);
        const a = (baseAngle + rotationDeg - 90) * rad;
        const x = Math.cos(a) * RING_RADIUS;
        const y = Math.sin(a) * RING_RADIUS;
        dot.style.transform = `translate(-50%, -50%) translate3d(${x}px, ${y}px, 0)`;
      });
    }

    function applyRingRotation() {
      const ring = document.getElementById("weekRing");
      if (ring) ring.style.setProperty("--ring-rot", ringCurrentRot + "deg");
      positionRingDots(ringCurrentRot);
    }

    function ringTick() {
      const diff = ringTargetRot - ringCurrentRot;
      if (Math.abs(diff) < 0.2) {
        ringCurrentRot = ringTargetRot;
        applyRingRotation();
        ringAnimating = false;
        return;
      }
      ringCurrentRot += diff * 0.22;
      applyRingRotation();
      requestAnimationFrame(ringTick);
    }

    function setRingTarget(target) {
      ringTargetRot = target;
      if (!ringAnimating) {
        ringAnimating = true;
        requestAnimationFrame(ringTick);
      }
    }

    function renderWeek() {
      const carousel = document.getElementById("weekCarousel");
      const dotsWrap = document.getElementById("weekDots");
      const ringDotsWrap = document.getElementById("weekRingDots");
      const todayIndex = new Date().getDay();

      carousel.innerHTML = "";
      dotsWrap.innerHTML = "";
      ringDotsWrap.innerHTML = "";

      for (let i = 0; i < WEEK_SIZE; i++) {
        const dot = document.createElement("div");
        dot.className = "ring-dot";
        dot.dataset.day = i;
        dot.textContent = dayLetters[i];
        if (i === todayIndex) dot.classList.add("today");
        if (isFieldDay(i)) dot.classList.add("field-day");
        if (isOffDay(i)) dot.classList.add("offday");
        ringDotsWrap.appendChild(dot);
      }
      positionRingDots(ringCurrentRot);

      for (let pos = 0; pos < TOTAL_SLIDES; pos++) {
        const dayIndex = pos % WEEK_SIZE;
        const subjects = getCurrentSchedule()[dayIndex] || [];
        const field = isFieldDay(dayIndex);

        const slide = document.createElement("div");
        slide.className = "week-slide";
        slide.dataset.day = dayIndex;
        slide.dataset.pos = pos;

        const card = document.createElement("div");
        card.className = "week-day";
        if (dayIndex === todayIndex) card.classList.add("today");
        if (field) card.classList.add("field-day");

        let countLabel;
        if (subjects.length === 0 || field) countLabel = field ? "Field Day" : "Day Off";
        else countLabel = subjects.length + (subjects.length === 1 ? " Class" : " Classes");

        let bodyHtml = "";
        if (subjects.length === 0 || field) {
          if (field) {
            bodyHtml = `<div class="week-empty field-day">
              <span class="field-icon">🧑‍🏫</span>
              <span class="field-title">Field Training</span>
              <span class="field-sub">No fixed hours</span>
            </div>`;
          } else {
            bodyHtml = `<div class="week-empty">No classes 🎉</div>`;
          }
        } else {
          bodyHtml = `<div class="week-day-body">`;
          getPeriodsForDay(dayIndex).filter(p => p.type === "lesson").forEach(period => {
            bodyHtml += `
              <div class="week-row">
                <span class="week-subject">${esc(subjects[period.index])}</span>
                <span class="week-time">${formatTime12h(period.start)} – ${formatTime12h(period.end)}</span>
              </div>`;
          });
          bodyHtml += `</div>`;
        }

        card.innerHTML = `
          <div class="week-day-header">
            <div class="week-day-title">
              <span class="week-day-letter">${dayLetters[dayIndex]}</span>
              <span class="week-day-name">${days[dayIndex]}</span>
            </div>
            <span class="week-day-count">${countLabel}</span>
          </div>
          ${bodyHtml}`;
        slide.appendChild(card);
        carousel.appendChild(slide);

        slide.addEventListener("click", () => {
          if (slide.dataset.day === String(weekCurrentIndex)) return;
          scrollToDay(Number(slide.dataset.day));
        });
      }

      for (let d = 0; d < WEEK_SIZE; d++) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "track-day";
        dot.dataset.day = d;
        dot.textContent = d + 1;
        if (d === todayIndex) dot.classList.add("today");
        if (isFieldDay(d)) dot.classList.add("field-day");
        if (isOffDay(d)) dot.classList.add("offday");
        attachBtnRipple(dot);
        dot.addEventListener("click", () => scrollToDay(d));
        dotsWrap.appendChild(dot);
      }

      carousel.addEventListener("scroll", onCarouselScroll, { passive: true });
      if ("onscrollend" in window) carousel.addEventListener("scrollend", onScrollEnded);

      attachTapFeedback(carousel, ".week-row");

      requestAnimationFrame(() => scrollToDay(todayIndex, "auto"));
    }

    function getSlideByPos(pos) {
      return document.querySelector(`.week-slide[data-pos="${pos}"]`);
    }

    function scrollToDay(dayIndex, behavior = "smooth") {
      const carousel = document.getElementById("weekCarousel");
      const slide = getSlideByPos(dayIndex + REAL_OFFSET);
      if (!slide) return;

      isJumping = true;
      const targetLeft = slide.offsetLeft - (carousel.clientWidth - slide.offsetWidth) / 2;
      carousel.scrollTo({ left: targetLeft, behavior });
      updateActiveDot(dayIndex);

      const unlock = () => { isJumping = false; };
      if (behavior === "auto") requestAnimationFrame(unlock);
      else setTimeout(unlock, 500);
    }

    function onCarouselScroll() {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        scrollRaf = 0;
        processCarouselScroll();
      });
    }

    function processCarouselScroll() {
      const carousel = document.getElementById("weekCarousel");
      const slides = carousel.querySelectorAll(".week-slide");
      if (!slides.length) return;

      const center = carousel.scrollLeft + carousel.clientWidth / 2;
      const first = slides[0];
      const stride = first.offsetWidth + 14;
      const firstCenter = first.offsetLeft + first.offsetWidth / 2;

      const centers = [];
      slides.forEach(s => centers.push(s.offsetLeft + s.offsetWidth / 2));

      let closest = 0, minD = Infinity;
      slides.forEach((slide, i) => {
        const ad = Math.abs((centers[i] - center) / stride);
        const scale = Math.max(0.84, 1 - ad * 0.12);
        const opacity = ad < 0.04 ? 1 : Math.max(0.55, 1 - ad * 0.32);
        const z = Math.max(1, Math.round(100 - ad * 40));

        slide.style.transform = `translate3d(0,0,0) scale(${scale})`;
        slide.style.opacity = opacity;
        slide.style.zIndex = String(z);
        slide.style.pointerEvents = ad < 0.5 ? "auto" : "none";

        const d = Math.abs(centers[i] - center);
        if (d < minD) { minD = d; closest = i; }
      });

      setRingTarget(-((center - firstCenter) / stride) * (360 / WEEK_SIZE));

      if (!isJumping) {
        const dayIndex = closest % WEEK_SIZE;
        if (dayIndex !== weekCurrentIndex) updateActiveDot(dayIndex);

        if (!("onscrollend" in window)) {
          clearTimeout(settleTimer);
          settleTimer = setTimeout(() => settlePosition(closest), 180);
        }
      }
    }

    function onScrollEnded() {
      if (isJumping) return;
      const carousel = document.getElementById("weekCarousel");
      const slides = carousel.querySelectorAll(".week-slide");
      const center = carousel.scrollLeft + carousel.clientWidth / 2;
      let closest = 0, minD = Infinity;
      slides.forEach((s, i) => {
        const c = s.offsetLeft + s.offsetWidth / 2;
        const d = Math.abs(c - center);
        if (d < minD) { minD = d; closest = i; }
      });
      settlePosition(closest);
    }

    function settlePosition(pos) {
      if (isJumping) return;
      if (pos >= REAL_OFFSET && pos < REAL_OFFSET + WEEK_SIZE) return;

      const carousel = document.getElementById("weekCarousel");
      const targetPos = (pos % WEEK_SIZE) + REAL_OFFSET;
      const targetSlide = getSlideByPos(targetPos);
      if (!targetSlide) return;

      const targetLeft = targetSlide.offsetLeft - (carousel.clientWidth - targetSlide.offsetWidth) / 2;
      isJumping = true;
      carousel.scrollTo({ left: targetLeft, behavior: "auto" });

      const firstSlide = carousel.querySelector(".week-slide");
      const stride = firstSlide.offsetWidth + 14;
      const firstCenter = firstSlide.offsetLeft + firstSlide.offsetWidth / 2;
      const centerPos = (targetLeft + carousel.clientWidth / 2 - firstCenter) / stride;
      setRingTarget(-centerPos * (360 / WEEK_SIZE));

      requestAnimationFrame(() => requestAnimationFrame(() => { isJumping = false; }));
    }

    function updateActiveDot(dayIndex) {
      weekCurrentIndex = dayIndex;
      document.querySelectorAll(".track-day").forEach(d =>
        d.classList.toggle("active", Number(d.dataset.day) === dayIndex));
      document.querySelectorAll(".ring-dot").forEach(d =>
        d.classList.toggle("active", Number(d.dataset.day) === dayIndex));
    }

    const todayView = document.getElementById("todayView");
    const weekView = document.getElementById("weekView");
    const viewToggleToday = document.getElementById("viewToggle");
    const viewToggleWeek = document.getElementById("viewToggle2");
    const FADE_MS = 360;
    let isAnimating = false;

    function switchView(target) {
      if (isAnimating) return;
      const currentView = target === "today" ? weekView : todayView;
      const nextView   = target === "today" ? todayView : weekView;

      isAnimating = true;
      currentView.classList.add("is-fading-out");

      setTimeout(() => {
        currentView.classList.remove("is-fading-out");
        currentView.classList.add("is-hidden");

        nextView.classList.remove("is-hidden");
        nextView.classList.add("is-fading-in");

        if (target === "week") {
          if (!weekRendered) { renderWeek(); weekRendered = true; }
          else requestAnimationFrame(() => scrollToDay(weekCurrentIndex, "auto"));
        }

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            nextView.classList.remove("is-fading-in");
            setTimeout(() => { isAnimating = false; }, FADE_MS);
          });
        });
      }, FADE_MS);
    }

    viewToggleToday.addEventListener("click", () => switchView("week"));
    viewToggleWeek.addEventListener("click", () => switchView("today"));

    const setupOverlay = document.getElementById("setupOverlay");
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const sectionOptions = document.getElementById("sectionOptions");
    const setupBack = document.getElementById("setupBack");

    function openSetup() {
      updateSetupInfo();
      renderYearOptions();
      setupOverlay.classList.remove("hidden");
      step1.hidden = false;
      step2.hidden = true;
    }
    function closeSetup() { setupOverlay.classList.add("hidden"); }

    function renderYearOptions() {
      const wrap = document.getElementById("yearOptions");
      if (!wrap) return;
      wrap.innerHTML = "";
      yearKeys().forEach(year => {
        const n = sectionsOf(year).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "setup-option";
        btn.dataset.year = year;
        if (userSettings && userSettings.year === year) btn.classList.add("current");
        btn.innerHTML = `
          <span class="setup-option-title">${esc(yearLabel(year))}</span>
          <span class="setup-option-sub">${n} section${n === 1 ? "" : "s"} available</span>`;
        attachBtnRipple(btn);
        btn.addEventListener("click", () => chooseYear(year));
        wrap.appendChild(btn);
      });
    }

    function chooseYear(year) {
      renderSectionOptions(year);
      step1.hidden = true;
      step2.hidden = false;
    }

    function renderSectionOptions(year) {
      sectionOptions.innerHTML = "";
      const sections = sectionsOf(year);
      sections.forEach(num => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "setup-option";
        if (userSettings && userSettings.year === year && String(userSettings.section) === String(num)) {
          btn.classList.add("current");
        }
        btn.innerHTML = `
          <span class="setup-option-title">Section ${num}</span>
          <span class="setup-option-sub">Weekly program</span>`;
        attachBtnRipple(btn);
        btn.addEventListener("click", () => chooseSection(year, num));
        sectionOptions.appendChild(btn);
      });
    }

    function chooseSection(year, section) {
      saveSettings(year, section);
      userSettings = { year, section };
      reportTarget();
      lastTodayKey = "";
      lastTomorrowKey = "";
      lastAdKey = "";
      updateSectionBadges();
      updatePage();
      refreshWeekIfVisible();
      closeSetup();
    }

    setupBack.addEventListener("click", () => {
      step1.hidden = false;
      step2.hidden = true;
    });
    document.getElementById("settingsBtn").addEventListener("click", openSetup);
    document.getElementById("settingsBtn2").addEventListener("click", openSetup);
    attachBtnRipple(document.getElementById("settingsBtn"));
    attachBtnRipple(document.getElementById("settingsBtn2"));
    attachBtnRipple(viewToggleToday);
    attachBtnRipple(viewToggleWeek);

    function showSplash() {
      const splash = document.getElementById("splash");
      const now = new Date();
      const day = now.getDay();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const s = getCurrentStatus(day, nowMinutes, now.getSeconds());

      if (s.state === "finished") {
        splash.classList.add("hidden");
        document.body.classList.add("skip-splash");
        return;
      }

      const valueEl = document.getElementById("splashValue");
      const labelEl = document.getElementById("splashLabel");
      const subEl = document.getElementById("splashSub");
      const dotEl = document.getElementById("splashDot");

      valueEl.textContent = s.value;
      labelEl.textContent = s.label;
      subEl.textContent = s.detail;

      if (s.state === "lesson") dotEl.textContent = "In session";
      else if (s.state === "break") dotEl.textContent = "On break";
      else if (s.state === "before") dotEl.textContent = "Up next";
      else if (s.state === "field") dotEl.textContent = "Field day";
      else dotEl.textContent = "Status";

      setTimeout(() => {
        splash.classList.add("leaving");
        setTimeout(() => splash.classList.add("hidden"), 650);
      }, 3000);
    }

    /* ===== الوضع الداكن ===== */
    const THEME_KEY = "scheduleTheme";
    let themeBusy = false;

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }

    function applyTheme(t) {
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", t === "dark" ? "#17120f" : "#f5e6d8");

      const icon = t === "dark" ? "☀️" : "🌙";
      const label = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
      ["themeBtn", "themeBtn2"].forEach(id => {
        const b = document.getElementById(id);
        if (b) { b.textContent = icon; b.setAttribute("aria-label", label); }
      });
    }

    function toggleTheme(btn) {
      if (themeBusy) return;
      const next = currentTheme() === "dark" ? "light" : "dark";
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}

      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        applyTheme(next);
        return;
      }

      themeBusy = true;
      const r = btn.getBoundingClientRect();
      const veil = document.createElement("div");
      veil.className = "theme-veil " + (next === "dark" ? "to-dark" : "to-light");
      veil.style.setProperty("--vx", (r.left + r.width / 2) + "px");
      veil.style.setProperty("--vy", (r.top + r.height / 2) + "px");
      document.body.appendChild(veil);

      requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.add("expand")));

      setTimeout(() => {
        applyTheme(next);
        veil.classList.add("fade");
        setTimeout(() => { veil.remove(); themeBusy = false; }, 420);
      }, 480);
    }

    ["themeBtn", "themeBtn2"].forEach(id => {
      const b = document.getElementById(id);
      if (!b) return;
      attachBtnRipple(b);
      b.addEventListener("click", () => toggleTheme(b));
    });
    applyTheme(currentTheme());

    attachTapFeedback(document.body, "#adBanner");

    function boot() {
      const hv = document.getElementById("htmlVer");
      if (hv) hv.textContent = "HTML " + HTML_VERSION;
      const saved = loadSettings();
      if (saved) {
        userSettings = saved;
        reportTarget();
        updateSectionBadges();
        updatePage();
        closeSetup();
        showSplash();
      } else {
        openSetup();
        document.getElementById("splash").classList.add("hidden");
      }

      setInterval(() => {
        if (!userSettings) return;
        updatePage();
      }, 1000);
    }

    window.addEventListener("resize", () => {
      if (weekRendered && !weekView.classList.contains("is-hidden")) {
        requestAnimationFrame(() => scrollToDay(weekCurrentIndex, "auto"));
      }
    });

    boot();
  </script>
