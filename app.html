<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5e6d8">
  <title>My University Schedule</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("scheduleTheme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#17120f");
        }
      } catch (e) {}
    })();
  </script>

  <style>
    @font-face {
      font-family: "CustomFont";
      src: url("font.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-1: #fbf1e4; --bg-2: #f7e6d3; --bg-3: #f0d4b8; --bg-4: #ecd0b3;
      --glass-border: rgba(255, 255, 255, 0.85);
      --text-main: #211a15; --text-soft: #6a5849; --text-muted: #a89280;
      --text-faint: #c8b6a5; --text-on-dark: #fff7f0;
      --orange: #ff7a3d; --orange-deep: #ff5500; --orange-soft: #ffb98f;
      --orange-glow: rgba(255, 122, 61, 0.35);
      --blue: #4a90e2; --blue-deep: #2c6fc4; --blue-glow: rgba(74, 144, 226, 0.4);
      --field: #7a9b4e; --field-deep: #5c7a35;
      --dark: #171412; --dark-2: #221d18;
      --divider: rgba(160, 120, 90, 0.14);
      --shadow-xs: 0 2px 6px rgba(160, 100, 60, 0.06);
      --shadow-sm: 0 6px 18px rgba(160, 100, 60, 0.09);
      --shadow-md: 0 14px 34px rgba(160, 100, 60, 0.13);
      --shadow-lg: 0 24px 55px rgba(160, 100, 60, 0.20);
      --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      --r-md: 20px; --r-lg: 24px; --r-xl: 28px; --r-full: 999px;

      --side-pad: 18px;
      --v-gap: 14px;
      --footer-space: 50px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100dvh; margin: 0; padding: 0;
      overflow: hidden;
      background: linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 40%, var(--bg-3) 75%, var(--bg-4) 100%);
      color: var(--text-main);
      font-family: "CustomFont", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }

    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.03;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>");
    }

    .background-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; }
    .blob-orange {
      width: 460px; height: 460px;
      background: radial-gradient(circle at 35% 35%, #ffd2b0 0%, #ff8a4a 40%, #ff5500 70%, transparent 100%);
      top: 40%; left: -180px; opacity: 0.55;
      animation: floatA 16s ease-in-out infinite;
    }
    .blob-peach {
      width: 400px; height: 400px;
      background: radial-gradient(circle at 40% 40%, #fff0dc 0%, #ffbb8c 50%, transparent 100%);
      bottom: -140px; right: -140px; opacity: 0.8;
      animation: floatB 20s ease-in-out infinite;
    }
    .blob-purple {
      width: 500px; height: 500px;
      background: radial-gradient(circle at 50% 50%, #fff5ea 0%, #ffe0c4 55%, transparent 100%);
      top: -200px; right: -200px; opacity: 0.95;
      animation: floatC 24s ease-in-out infinite;
    }
    @keyframes floatA { 0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(20px,-30px,0) scale(1.05);} }
    @keyframes floatB { 0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-25px,20px,0) scale(1.06);} }
    @keyframes floatC { 0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(15px,25px,0) scale(1.04);} }

    .app {
      position: relative; z-index: 2;
      width: 100%; height: 100dvh;
      max-width: 520px; margin: 0 auto;
      padding:
        calc(var(--v-gap) + env(safe-area-inset-top))
        0
        calc(var(--v-gap) + var(--footer-space) + env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    body.skip-splash .app {
      animation: appFadeIn 0.85s cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    @keyframes appFadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .view {
      flex: 1; min-height: 0;
      padding: 0 var(--side-pad);
      display: flex; flex-direction: column; gap: var(--v-gap);
      opacity: 1; transform: translateY(0);
      transition: opacity 0.36s cubic-bezier(0.32, 0.72, 0, 1), transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: opacity, transform;
      overflow: hidden;
    }
    .view.is-hidden { display: none !important; }
    .view.is-fading-out { opacity: 0; transform: translateY(12px) scale(0.98); pointer-events: none; }
    .view.is-fading-in { opacity: 0; transform: translateY(-12px) scale(0.98); }

    .hdr, .week-hdr {
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: 4px;
      padding: 0;
    }
    .hdr-top, .week-hdr-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 11px; border-radius: var(--r-full);
      background: linear-gradient(135deg, rgba(255,122,61,0.14), rgba(255,122,61,0.05));
      border: 1px solid rgba(255,122,61,0.28);
      color: var(--orange-deep);
      font-size: 9px; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      white-space: nowrap;
    }
    .badge::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: var(--orange-deep);
      box-shadow: 0 0 6px var(--orange-glow);
      animation: dotPulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes dotPulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.55; }
    }

    .hdr-actions { display: flex; gap: 6px; }
    .mini-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: linear-gradient(160deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.45) 100%);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow: var(--shadow-xs), var(--shadow-inner);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      position: relative; overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .mini-btn::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at var(--tx,50%) var(--ty,50%), var(--blue-glow) 0%, transparent 65%);
      opacity: 0; transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .mini-btn.tapped::before { opacity: 1; transition: opacity 0s; }
    .mini-btn:active { transform: scale(0.88); }
    .mini-btn.active {
      background: linear-gradient(160deg, var(--orange) 0%, var(--orange-deep) 100%);
      color: #fff; border-color: transparent;
      box-shadow: 0 6px 18px var(--orange-glow), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .hdr-name-row, .week-name-row {
      display: flex; align-items: baseline;
      justify-content: space-between; gap: 10px;
      margin-top: 4px;
    }
    #dayName, #weekTitle {
      font-size: clamp(28px, 4.8vh, 36px);
      font-weight: 800;
      margin: 0; letter-spacing: -1.4px; line-height: 1;
      background: linear-gradient(135deg, #1a1410 0%, #3a2a1e 60%, #ff7a3d 130%);
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 8s ease-in-out infinite;
    }
    @keyframes gradientShift {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    #clock {
      direction: ltr; white-space: nowrap;
      font-size: clamp(14px, 2.3vh, 17px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.6px;
      color: var(--text-soft);
    }
    #date, #weekSubtitle {
      color: var(--text-soft);
      font-size: clamp(13px, 2vh, 15px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ===== TODAY VIEW — space-between ===== */
    #todayView {
      display: grid;
      grid-template-rows: auto auto auto auto;
      gap: var(--v-gap);
      align-content: space-between;
      min-height: 0;
    }
    #todayView.is-hidden { display: none !important; }

    .schedule-wrap {
      min-height: 0;
      max-height: 38vh;
      overflow: hidden;
      border-radius: var(--r-lg);
      display: flex;
    }

    .schedule {
      position: relative;
      flex: 1;
      display: flex; flex-direction: column;
      background: linear-gradient(160deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.42) 100%);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      box-shadow: var(--shadow-md), var(--shadow-inner);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .schedule::-webkit-scrollbar { display: none; }
    .schedule::before {
      content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
      pointer-events: none; z-index: 3;
    }

    .lesson, .break, .empty {
      position: relative;
      padding: clamp(11px, 1.9vh, 15px) clamp(14px, 2.6vw, 18px);
      overflow: hidden;
      flex-shrink: 0;
    }
    .lesson + *, .break + * { border-top: 1px solid var(--divider); }

    .lesson {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; cursor: pointer;
    }
    .tap-zone::after {
      content: ""; position: absolute;
      width: 220px; height: 220px; border-radius: 50%;
      left: var(--tx, 50%); top: var(--ty, 50%);
      margin: -110px 0 0 -110px;
      background: radial-gradient(circle, var(--blue-glow) 0%, rgba(74,144,226,0.15) 35%, transparent 70%);
      opacity: 0; transform: scale(0.2);
      transition: opacity 0.7s cubic-bezier(0.2,0,0.4,1), transform 0.7s cubic-bezier(0.2,0,0.4,1);
      pointer-events: none;
    }
    .tap-zone.tapped::after {
      opacity: 1; transform: scale(1);
      transition: opacity 0s, transform 0s;
    }
    .lesson.current {
      background: linear-gradient(160deg, var(--dark-2) 0%, var(--dark) 100%);
      border-top-color: transparent !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 24px rgba(30,15,5,0.18);
    }
    .lesson.current::before {
      content: ""; position: absolute; left: 0; top: 10%; bottom: 10%;
      width: 3px; border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, var(--orange) 0%, var(--orange-deep) 100%);
      box-shadow: 0 0 12px var(--orange-glow);
      animation: glowPulse 2.2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 10px var(--orange-glow); }
      50% { box-shadow: 0 0 18px rgba(255,85,0,0.6); }
    }
    .lesson.past { opacity: 0.42; filter: saturate(0.65); }

    .lesson-name {
      font-size: clamp(13.5px, 2.15vh, 15.5px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .lesson-time {
      color: var(--text-muted);
      font-size: clamp(9.5px, 1.5vh, 10.5px);
      margin-top: 3px;
      direction: ltr; text-align: left;
      font-weight: 600; letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .lesson-status {
      font-size: clamp(8.5px, 1.35vh, 9.5px);
      white-space: nowrap;
      padding: 5px 11px;
      border-radius: var(--r-full);
      background: rgba(255,255,255,0.6);
      color: var(--text-soft);
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.85);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: var(--shadow-xs), inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .lesson.current .lesson-name { color: var(--text-on-dark); }
    .lesson.current .lesson-time { color: rgba(255,240,230,0.55); }
    .lesson.current .lesson-status {
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-deep) 100%);
      color: #fff; font-weight: 800; border: none;
      box-shadow: 0 5px 16px var(--orange-glow), inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .break {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      font-size: clamp(9.5px, 1.5vh, 10.5px);
      color: var(--orange-deep);
      font-weight: 800; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .break.current { background: linear-gradient(90deg, rgba(255,122,61,0.14), rgba(255,122,61,0.04)); }
    .break.past { opacity: 0.42; }
    .break-time {
      direction: ltr; white-space: nowrap; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--text-muted);
    }
    .break.current .break-time { color: var(--orange-deep); }

    .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: clamp(11px, 1.7vh, 12.5px);
      line-height: 1.5; font-weight: 700;
      padding: clamp(20px, 3.6vh, 32px) 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .empty.field-day {
      color: var(--field-deep);
      background: linear-gradient(160deg, rgba(212,227,184,0.22) 0%, rgba(255,240,210,0.06) 100%);
    }
    .field-icon {
      font-size: clamp(22px, 3.4vh, 28px);
      display: block; margin-bottom: 5px;
      filter: drop-shadow(0 4px 10px rgba(122, 155, 78, 0.35));
      animation: iconBob 2.8s ease-in-out infinite;
    }
    @keyframes iconBob {
      0%,100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-4px) rotate(-3deg); }
    }
    .field-title {
      font-size: clamp(13px, 2vh, 15px); font-weight: 800;
      color: var(--field-deep); display: block;
    }
    .field-sub {
      display: block; margin-top: 2px;
      font-size: clamp(9.5px, 1.5vh, 11px); font-weight: 600;
      color: #7f8e64; letter-spacing: 0.02em;
    }

    .countdown-card {
      position: relative; overflow: hidden;
      border-radius: var(--r-xl);
      flex-shrink: 0;
      display: flex; align-items: center;
      text-align: left;
      padding: clamp(16px, 2.4vh, 20px) clamp(18px, 3vw, 24px);

      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 45%),
        linear-gradient(155deg, #fff8ee 0%, #ffe9cf 40%, #ffd4a8 75%, #ffbe88 100%);
      border: 1px solid rgba(255, 122, 61, 0.35);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,1);
      transition: background 0.6s ease, border-color 0.6s ease,
                  box-shadow 0.6s ease, color 0.4s ease;
    }
    .countdown-card::after {
      content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
      pointer-events: none; z-index: 2;
    }
    .countdown-card::before {
      content: ""; position: absolute;
      width: 300px; height: 300px; border-radius: 50%;
      filter: blur(30px);
      right: -90px; bottom: -120px;
      opacity: 0.85; z-index: 0;
      pointer-events: none;
      animation: floatA 12s ease-in-out infinite;
      transition: background 0.6s ease, opacity 0.6s ease;
      background: radial-gradient(circle at 30% 30%, #ffd0ad 0%, #ff8a4a 40%, #ff5500 75%, transparent 100%);
    }
    .countdown-card .cd-aura {
      position: absolute;
      width: 160px; height: 160px; border-radius: 50%;
      filter: blur(40px);
      left: -50px; top: -60px;
      opacity: 0.55; z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle, #fff3e0 0%, #ffc6a3 60%, transparent 100%);
      transition: background 0.6s ease, opacity 0.6s ease;
    }
    .countdown-card > * { position: relative; z-index: 1; }

    .cd-left {
      display: flex; flex-direction: column;
      min-width: 0; flex: 1;
    }

    .countdown-card.cd-lesson {
      background:
        linear-gradient(135deg, rgba(120, 180, 255, 0.12) 0%, rgba(120, 180, 255, 0) 45%),
        linear-gradient(155deg, #2e3a4d 0%, #1e2836 40%, #131a24 75%, #0a0e14 100%);
      border-color: rgba(74, 144, 226, 0.55);
      box-shadow:
        0 24px 60px rgba(45, 110, 190, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .countdown-card.cd-lesson::before {
      background: radial-gradient(circle at 30% 30%, #d6e4ff 0%, #4a90e2 40%, #2c6fc4 75%, transparent 100%);
      opacity: 0.9;
    }
    .countdown-card.cd-lesson .cd-aura {
      background: radial-gradient(circle, #cfe2ff 0%, #4a90e2 60%, transparent 100%);
      opacity: 0.5;
    }
    .countdown-card.cd-lesson::after {
      background: linear-gradient(90deg, transparent, rgba(180, 210, 255, 0.6), transparent);
    }
    .countdown-card.cd-lesson #countLabel { color: rgba(180, 210, 255, 0.85); }
    .countdown-card.cd-lesson #countValue {
      background: linear-gradient(135deg, #ffffff 0%, #cfe2ff 45%, #4a90e2 120%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .countdown-card.cd-lesson #countDetail { color: rgba(200, 220, 255, 0.8); }

    .countdown-card.cd-break {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 45%),
        linear-gradient(155deg, #fffbf0 0%, #fff0cc 40%, #ffe0a0 75%, #ffcf80 100%);
      border-color: rgba(255, 159, 28, 0.55);
      box-shadow:
        0 22px 55px rgba(255, 159, 28, 0.28),
        inset 0 1px 0 rgba(255,255,255,1);
    }
    .countdown-card.cd-break::before {
      background: radial-gradient(circle at 30% 30%, #fff0c2 0%, #ffb347 40%, #ff9f1c 75%, transparent 100%);
      opacity: 0.9;
    }
    .countdown-card.cd-break .cd-aura {
      background: radial-gradient(circle, #fffbe0 0%, #ffb347 60%, transparent 100%);
      opacity: 0.55;
    }
    .countdown-card.cd-break #countLabel { color: #a06000; }
    .countdown-card.cd-break #countValue {
      background: linear-gradient(135deg, #5a3500 0%, #b06e00 45%, #ff9f1c 120%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .countdown-card.cd-break #countDetail { color: #8a5a10; }

    .countdown-card.cd-finished {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 45%),
        linear-gradient(155deg, #fdfdfc 0%, #f2efe9 40%, #e4dfd5 75%, #d6cfc2 100%);
      border-color: rgba(180, 170, 160, 0.35);
      box-shadow:
        0 12px 32px rgba(120, 100, 80, 0.08),
        inset 0 1px 0 rgba(255,255,255,1);
    }
    .countdown-card.cd-finished::before { opacity: 0; }
    .countdown-card.cd-finished .cd-aura { opacity: 0; }
    .countdown-card.cd-finished #countLabel { color: #a09889; }
    .countdown-card.cd-finished #countValue {
      background: linear-gradient(135deg, #7a7268 0%, #a89e92 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .countdown-card.cd-finished #countDetail { color: #9a9187; }

    .countdown-card.cd-field {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 45%),
        linear-gradient(155deg, #fbfdee 0%, #ecf4d4 40%, #d9e7b3 75%, #c4d894 100%);
      border-color: rgba(122, 155, 78, 0.5);
      box-shadow:
        0 22px 55px rgba(122, 155, 78, 0.22),
        inset 0 1px 0 rgba(255,255,255,1);
    }
    .countdown-card.cd-field::before {
      background: radial-gradient(circle at 30% 30%, #e6f0c2 0%, #a8c470 40%, #7a9b4e 75%, transparent 100%);
      opacity: 0.9;
    }
    .countdown-card.cd-field .cd-aura {
      background: radial-gradient(circle, #f0f6da 0%, #a8c470 60%, transparent 100%);
      opacity: 0.55;
    }

      background: rgba(255,255,255,0.5);
      color: var(--text-soft); font-family: inherit;
      font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.2s ease;
    }
    .setup-back:active { transform: scale(0.95); opacity: 0.7; }

    .splash {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(165deg, #fbf1e4 0%, #f7e6d3 40%, #f0d4b8 75%, #ecd0b3 100%);
      opacity: 1;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash.leaving { opacity: 0; visibility: hidden; pointer-events: none; }

    .splash::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(255,200,160,0.6) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(255,170,120,0.5) 0%, transparent 50%);
      pointer-events: none;
      animation: bgShift 4s ease-in-out infinite;
    }
    @keyframes bgShift {
      0%,100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .splash-particle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffc6a3 0%, #ff7a3d 70%, transparent 100%);
      opacity: 0.6;
      pointer-events: none;
      animation: particleFloat 6s ease-in-out infinite;
    }
    .splash-particle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; width: 8px; height: 8px; }
    .splash-particle:nth-child(2) { top: 70%; left: 80%; animation-delay: 1s; width: 5px; height: 5px; }
    .splash-particle:nth-child(3) { top: 40%; left: 88%; animation-delay: 2s; width: 10px; height: 10px; }
    .splash-particle:nth-child(4) { top: 82%; left: 22%; animation-delay: 3s; width: 6px; height: 6px; }
    .splash-particle:nth-child(5) { top: 12%; left: 62%; animation-delay: 1.5s; width: 7px; height: 7px; }
    @keyframes particleFloat {
      0%,100% { transform: translate(0,0) scale(1); opacity: 0.4; }
      50% { transform: translate(20px,-30px) scale(1.4); opacity: 0.8; }
    }

    .splash-card {
      position: relative; z-index: 1;
      text-align: center;
      padding: 26px 30px;
      max-width: 380px;
      animation: splashCardIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes splashCardIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.75) rotate(-4deg); }
      60% { opacity: 1; transform: translateY(-6px) scale(1.03) rotate(0.8deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    .splash.leaving .splash-card {
      animation: splashCardOut 0.6s cubic-bezier(0.4, 0, 1, 1) both;
    }
    @keyframes splashCardOut {
      0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.18); filter: blur(10px); }
    }
    .splash.leaving .splash-dot,
    .splash.leaving .splash-value,
    .splash.leaving .splash-label,
    .splash.leaving .splash-sub {
      animation: fadeOutUp 0.45s cubic-bezier(0.4, 0, 1, 1) both;
    }
    @keyframes fadeOutUp {
      to { opacity: 0; transform: translateY(-18px); }
    }

    .splash-dot {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 13px; border-radius: var(--r-full);
      background: linear-gradient(135deg, rgba(255,122,61,0.16), rgba(255,122,61,0.05));
      border: 1px solid rgba(255,122,61,0.3);
      color: var(--orange-deep);
      font-size: 9px; font-weight: 800;
      letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 18px;
      animation: splashInDown 0.55s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes splashInDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .splash-dot::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--orange-deep);
      box-shadow: 0 0 8px var(--orange-glow);
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .splash-value {
      font-size: clamp(56px, 12vh, 84px);
      font-weight: 200;
      direction: ltr;
      font-variant-numeric: tabular-nums;
      letter-spacing: 3px;
      line-height: 1;
      background: linear-gradient(135deg, #2a1f18 0%, #6a4530 45%, #ff5500 120%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      animation: splashValueIn 0.85s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes splashValueIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.7); }
      55% { opacity: 1; transform: translateY(-4px) scale(1.06); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .splash-label {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-top: 10px;
      animation: splashInUp 0.55s 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes splashInUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .splash-sub {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      letter-spacing: -0.2px;
      max-width: 300px;
      margin-left: auto; margin-right: auto;
      line-height: 1.4;
      animation: splashInUp 0.55s 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @media (max-width: 380px) {
      :root { --side-pad: 14px; --v-gap: 12px; --footer-space: 46px; }
      .mini-btn { width: 30px; height: 30px; font-size: 12px; }
      .week-ring-wrap { width: 280px; height: 280px; margin: -140px 0 0 -140px; }
      .ring-pointer { margin-top: -150px; }
      .schedule-wrap { max-height: 34vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .countdown-card::before, .setup-icon, .splash::before,
      .splash-dot::before, .field-icon, .lesson.current::before,
      #dayName, #weekTitle { animation: none !important; }
    }

    /* ===== إصلاحات وتحسينات ===== */

    /* احتياط للأجهزة التي لا تدعم dvh */
    html, body { height: 100vh; height: 100dvh; }
    .app { height: 100vh; height: 100dvh; }

    /* الشاشات القصيرة: تمرير عمودي بدل القص */
    .view {
      overflow-x: hidden; overflow-y: auto;
      scrollbar-width: none; -ms-overflow-style: none;
      overscroll-behavior: contain;
      will-change: auto;
    }
    .view::-webkit-scrollbar { display: none; }
    .week-stage { min-height: 300px; }

    /* أداء */
    .mini-btn, .track-day, .tomorrow-lesson, .setup-option {
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .blob { filter: blur(60px); }
    #dayName, #weekTitle { animation: none; }
    .week-slide { will-change: transform; }

    /* زر التبديل العريض */
    .hdr-actions { align-items: center; }
    .badge { min-width: 0; }
    .toggle-btn {
      width: auto; min-width: 112px; height: 34px;
      padding: 0 13px 0 16px; gap: 7px;
      border-radius: var(--r-full);
      font-size: 11px; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      white-space: nowrap;
    }
    .toggle-btn::before { border-radius: var(--r-full); }
    .toggle-btn:active { transform: scale(0.95); }
    .toggle-btn .tb-tap { opacity: 0.7; font-weight: 700; }
    .toggle-btn .tb-arrow {
      font-size: 17px; line-height: 1;
      animation: tbNudge 1.8s ease-in-out infinite;
    }
    @keyframes tbNudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
    @media (max-width: 340px) {
      .toggle-btn { min-width: 0; padding: 0 11px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .toggle-btn .tb-arrow { animation: none; }
    }

    .setup-info {
      margin-top: 18px; padding: 11px 14px;
      border-radius: 14px; text-align: center;
      background: linear-gradient(160deg, rgba(255,122,61,0.12), rgba(255,122,61,0.04));
      border: 1px solid rgba(255,122,61,0.25);
    }
    .setup-info-label {
      font-size: 9px; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--orange-deep);
    }
    .setup-info-date {
      font-size: 13px; font-weight: 800;
      color: var(--text-main); margin-top: 3px;
    }
    .setup-info-divider {
      height: 1px; margin: 10px 4px 9px;
      background: linear-gradient(90deg, transparent, rgba(255,122,61,0.3), transparent);
    }
    .setup-info-notes {
      display: flex; flex-direction: column; gap: 7px;
      text-align: left;
    }
    .setup-info-note {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 10.5px; font-weight: 600;
      color: var(--text-soft); line-height: 1.45;
    }
    .setup-info-note .ni {
      flex-shrink: 0; width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 10px;
      background: rgba(255,122,61,0.16);
    }

    /* ===== بانر الإعلانات ===== */
    .ad-banner {
      position: relative; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border-radius: var(--r-lg);
      text-decoration: none; color: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.46) 100%);
      border: 1px solid rgba(255,122,61,0.3);
      box-shadow: var(--shadow-sm), var(--shadow-inner);
      -webkit-user-drag: none;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ad-banner[hidden] { display: none; }
    .ad-banner::before {
      content: ""; position: absolute; left: 0; top: 18%; bottom: 18%;
      width: 3px; border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, var(--orange), var(--orange-deep));
    }
    .ad-banner.clickable:active { transform: scale(0.98); }
    .ad-banner.ad-in { animation: adIn 0.5s cubic-bezier(0.32,0.72,0,1) backwards; }
    @keyframes adIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .ad-icon {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      background: linear-gradient(135deg, rgba(255,122,61,0.2), rgba(255,122,61,0.07));
      border: 1px solid rgba(255,122,61,0.25);
    }
    .ad-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .ad-title {
      font-size: clamp(12px, 1.85vh, 13.5px); font-weight: 800;
      color: var(--text-main); letter-spacing: -0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ad-text {
      font-size: clamp(10px, 1.5vh, 11px); font-weight: 600;
      color: var(--text-soft); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ad-title:empty, .ad-text:empty { display: none; }
    .ad-arrow {
      flex-shrink: 0; font-size: 20px; font-weight: 800;
      line-height: 1; color: var(--orange-deep);
    }
    .ad-banner:not(.clickable) .ad-arrow { display: none; }

    /* ===== غطاء انتقال الثيم (دائرة تتوسع من الزر) ===== */
    .theme-veil {
      position: fixed; inset: 0; z-index: 3000; pointer-events: none;
      clip-path: circle(0px at var(--vx) var(--vy));
      transition: clip-path 0.48s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
    }
    .theme-veil.to-dark { background: linear-gradient(165deg, #1c1713 0%, #17120f 40%, #120e0b 75%, #0e0b09 100%); }
    .theme-veil.to-light { background: linear-gradient(165deg, #fbf1e4 0%, #f7e6d3 40%, #f0d4b8 75%, #ecd0b3 100%); }
    .theme-veil.expand { clip-path: circle(160vmax at var(--vx) var(--vy)); }
    .theme-veil.fade { opacity: 0; }

    /* ===== ضبط الهيدر لاستيعاب ثلاثة أزرار ===== */
    .hdr-top, .week-hdr-top { flex-wrap: wrap; row-gap: 8px; }
    .hdr-actions { gap: 5px; margin-left: auto; }
    .mini-btn:not(.toggle-btn) { width: 30px; height: 30px; }
    .toggle-btn {
      height: 32px; min-width: 0; padding: 0 11px 0 13px;
      font-size: 10px; letter-spacing: 0.08em; gap: 5px;
    }
    .badge { letter-spacing: 0.1em; padding: 4px 10px; }

    /* ===== الوضع الداكن ===== */
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-1: #1c1713; --bg-2: #17120f; --bg-3: #120e0b; --bg-4: #0e0b09;
      --glass-border: rgba(255,255,255,0.09);
      --text-main: #f6ece3; --text-soft: #c9b8a8; --text-muted: #948272; --text-faint: #625448;
      --field-deep: #a9cb73;
      --divider: rgba(255,255,255,0.08);
      --shadow-xs: 0 2px 6px rgba(0,0,0,0.30);
      --shadow-sm: 0 6px 18px rgba(0,0,0,0.34);
      --shadow-md: 0 14px 34px rgba(0,0,0,0.40);
      --shadow-lg: 0 24px 55px rgba(0,0,0,0.50);
      --shadow-inner: inset 0 1px 0 rgba(255,255,255,0.07);
    }

    /* الخلفيات الزجاجية */
    html[data-theme="dark"] .mini-btn:not(.active),
    html[data-theme="dark"] .schedule,
    html[data-theme="dark"] .tomorrow-lesson,
    html[data-theme="dark"] .week-day,
    html[data-theme="dark"] .setup-card,
    html[data-theme="dark"] .setup-option:not(.current),
    html[data-theme="dark"] .ad-banner,
    html[data-theme="dark"] .track-day:not(.active):not(.today):not(.offday):not(.field-day) {
      background-image: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.04) 100%);
    }
    html[data-theme="dark"] .lesson-status,
    html[data-theme="dark"] .setup-back {
      background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1);
    }

    /* الخلفيات العامة والفقاعات */
    html[data-theme="dark"] .setup-overlay,
    html[data-theme="dark"] .splash {
      background-image: linear-gradient(165deg, #1c1713 0%, #17120f 40%, #120e0b 75%, #0e0b09 100%);
    }
    html[data-theme="dark"] .setup-overlay::before,
    html[data-theme="dark"] .splash::before {
      background:
        radial-gradient(circle at 20% 25%, rgba(255,122,61,0.16) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(255,90,20,0.12) 0%, transparent 50%);
    }
    html[data-theme="dark"] .blob-purple {
      background: radial-gradient(circle at 50% 50%, rgba(255,140,80,0.22) 0%, rgba(255,100,40,0.08) 55%, transparent 100%);
      opacity: 1;
    }
    html[data-theme="dark"] .blob-peach {
      background: radial-gradient(circle at 40% 40%, rgba(255,160,110,0.16) 0%, transparent 100%);
    }
    html[data-theme="dark"] .blob-orange { opacity: 0.32; }
    html[data-theme="dark"] .week-ring::after {
      background: radial-gradient(circle, rgba(255,140,80,0.07) 0%, transparent 70%);
    }
    html[data-theme="dark"] .today-footer { text-shadow: none; }

    /* عناوين بتدرج نصي */
    html[data-theme="dark"] #dayName,
    html[data-theme="dark"] #weekTitle {
      background-image: linear-gradient(135deg, #fff7f0 0%, #ffd9bf 60%, #ff7a3d 130%);
    }
    html[data-theme="dark"] .setup-header h1 {
      background-image: linear-gradient(135deg, #fff7f0 0%, #ffd9bf 80%);
    }
    html[data-theme="dark"] .splash-value {
      background-image: linear-gradient(135deg, #fff7f0 0%, #ffd9bf 45%, #ff7a3d 120%);
    }

    /* الحصة الحالية */
    html[data-theme="dark"] .lesson.current {
      background-image: linear-gradient(160deg, #3d2412 0%, #2a170b 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.4);
    }

    /* اليوم الميداني */
    html[data-theme="dark"] .empty.field-day {
      background-image: linear-gradient(160deg, rgba(122,155,78,0.16) 0%, rgba(122,155,78,0.04) 100%);
    }
    html[data-theme="dark"] .field-sub { color: #9fb77a; }
    html[data-theme="dark"] .ring-dot.field-day,
    html[data-theme="dark"] .week-day.field-day .week-day-letter {
      background-image: linear-gradient(135deg, #6f9145, #55742f);
    }

    /* حلقة الأيام وشريط الأيام */
    html[data-theme="dark"] .ring-dot.offday {
      background: rgba(255,255,255,0.08);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    html[data-theme="dark"] .ring-dot.offday.today { background: rgba(255,122,61,0.2); }
    html[data-theme="dark"] .track-day.offday:not(.active):not(.today) {
      background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06);
    }
    html[data-theme="dark"] .track-day.today:not(.active) { background: rgba(255,122,61,0.16); }
    html[data-theme="dark"] .track-day.field-day:not(.active):not(.today) { background: rgba(122,155,78,0.18); }

    /* بطاقة العد التنازلي */
    html[data-theme="dark"] .countdown-card.cd-before {
      background-image:
        linear-gradient(135deg, rgba(255,160,100,0.14) 0%, rgba(255,160,100,0) 45%),
        linear-gradient(155deg, #3d2515 0%, #2b1a0f 45%, #1c110a 100%);
      border-color: rgba(255,122,61,0.42);
      box-shadow: 0 24px 55px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    html[data-theme="dark"] .countdown-card.cd-before .cd-aura { opacity: 0.22; }
    html[data-theme="dark"] .countdown-card.cd-before #countLabel { color: #ffb98f; }
    html[data-theme="dark"] .countdown-card.cd-before #countValue {
      background-image: linear-gradient(135deg, #ffffff 0%, #ffd7bd 45%, #ff7a3d 120%);
    }
    html[data-theme="dark"] .countdown-card.cd-before #countDetail { color: #d9bfa9; }

    html[data-theme="dark"] .countdown-card.cd-break {
      background-image:
        linear-gradient(135deg, rgba(255,200,100,0.12) 0%, rgba(255,200,100,0) 45%),
        linear-gradient(155deg, #3b2a0e 0%, #2b1e0a 45%, #1d1407 100%);
      border-color: rgba(255,159,28,0.45);
      box-shadow: 0 22px 55px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    html[data-theme="dark"] .countdown-card.cd-break #countLabel { color: #ffcc80; }
    html[data-theme="dark"] .countdown-card.cd-break #countValue {
      background-image: linear-gradient(135deg, #fff4dc 0%, #ffcf80 45%, #ff9f1c 120%);
    }
    html[data-theme="dark"] .countdown-card.cd-break #countDetail { color: #e0b878; }

    html[data-theme="dark"] .countdown-card.cd-finished {
      background-image:
        linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 45%),
        linear-gradient(155deg, #2b2724 0%, #201d1a 45%, #171513 100%);
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    html[data-theme="dark"] .countdown-card.cd-finished #countLabel,
    html[data-theme="dark"] .countdown-card.cd-finished #countDetail { color: #8d857a; }
    html[data-theme="dark"] .countdown-card.cd-finished #countValue {
      background-image: linear-gradient(135deg, #c9c0b4 0%, #8d857a 100%);
    }

    html[data-theme="dark"] .countdown-card.cd-field {
      background-image:
        linear-gradient(135deg, rgba(180,220,120,0.1) 0%, rgba(180,220,120,0) 45%),
        linear-gradient(155deg, #26331a 0%, #1b2612 45%, #131b0d 100%);
      border-color: rgba(122,155,78,0.5);
      box-shadow: 0 22px 55px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    html[data-theme="dark"] .countdown-card.cd-field #countLabel,
    html[data-theme="dark"] .countdown-card.cd-field #countDetail { color: #a9cb73; }
    html[data-theme="dark"] .countdown-card.cd-field #countValue {
      background-image: linear-gradient(135deg, #eef8d6 0%, #a9cb73 45%, #7a9b4e 120%);
    }

    html[data-theme="dark"] .countdown-card.cd-off {
      background-image:
        linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 45%),
        linear-gradient(155deg, #2f261d 0%, #221a13 45%, #17110c 100%);
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    html[data-theme="dark"] .countdown-card.cd-off #countValue {
      background-image: linear-gradient(135deg, #cbb9a4 0%, #8f7d69 100%);
    }
  </style>
</head>
